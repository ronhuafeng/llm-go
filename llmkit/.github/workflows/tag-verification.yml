name: Tag verification

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  clean-consumer:
    name: Tag clean consumer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Resolve immutable tag through the public proxy
        run: |
          tag_commit="$(git rev-list -n 1 "${{ github.ref_name }}")"
          ./scripts/ci/verify-tag-consumer.sh \
            "${{ github.ref_name }}" \
            "$tag_commit" \
            "$RUNNER_TEMP/tag-verification"
          {
            echo '### Tag verification'
            echo '- Tag: `${{ github.ref_name }}`'
            echo "- Commit: \`$tag_commit\`"
            echo '- Exact proxy resolution, sums, and origin are attached as the `tag-verification` artifact.'
            echo '```json'
            cat "$RUNNER_TEMP/tag-verification/tag-evidence.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tag-verification
          path: ${{ runner.temp }}/tag-verification/tag-evidence.json
          if-no-files-found: error

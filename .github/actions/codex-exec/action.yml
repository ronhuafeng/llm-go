name: Run Codex repair
description: Run a trusted bounded repair controller using the run-selected official latest CLI and direct Responses provider.

inputs:
  api-key:
    description: Native provider API key, supplied only to the repair process.
    required: true
  responses-api-endpoint:
    description: Responses-compatible API base URL, without /responses.
    required: true
  working-directory:
    description: Repository-relative repair workspace.
    required: true
  prompt:
    description: Repair task context consumed by the trusted controller.
    required: false
  model:
    description: Selected Codex model.
    required: true
  reasoning-effort:
    description: Selected reasoning effort.
    required: true
  controller-path:
    description: Absolute path to the prebuilt trusted protocolupgrade controller.
    required: true
  control-sha256:
    description: Expected SHA-256 of the trusted controller.
    required: true
  candidate-dir:
    description: Prepared candidate artifact directory.
    required: true
  candidate-sha256:
    description: Verified prepared-candidate digest.
    required: true
  target-ref:
    description: Selected upstream reference.
    required: true
  target-kind:
    description: Selected upstream reference kind.
    required: true
  target-sha:
    description: Exact selected upstream commit.
    required: true
  continuation-file:
    description: Native-verified merged verifier continuation receipt.
    required: false
  checkpoint-dir:
    description: Private checkpoint directory outside the repair workspace.
    required: true

outputs:
  verifier_dir:
    description: Reviewed verifier-only proposal artifact directory.
    value: ${{ steps.codex.outputs.verifier_dir }}
  outcome:
    description: Deterministic repair outcome.
    value: ${{ steps.codex.outputs.outcome }}
  applied:
    description: Whether the controller accepted and applied the candidate.
    value: ${{ steps.codex.outputs.applied }}
  stage:
    description: Last deterministic controller stage.
    value: ${{ steps.codex.outputs.stage }}
  failure_category:
    description: Bounded failure category.
    value: ${{ steps.codex.outputs.failure_category }}
  target_ref:
    description: Exact selected upstream reference.
    value: ${{ steps.codex.outputs.target_ref }}
  target_kind:
    description: Selected upstream reference kind.
    value: ${{ steps.codex.outputs.target_kind }}
  target_sha:
    description: Exact selected upstream commit.
    value: ${{ steps.codex.outputs.target_sha }}
  candidate_dir:
    description: Retained candidate directory.
    value: ${{ steps.codex.outputs.candidate_dir }}
  candidate_sha256:
    description: Retained candidate digest.
    value: ${{ steps.codex.outputs.candidate_sha256 }}

runs:
  using: composite
  steps:
    - name: Set up official Codex latest
      id: runtime
      uses: ./.github/actions/setup-codex

    - name: Run trusted repair controller
      id: codex
      shell: bash
      env:
        AZURE_OPENAI_API_KEY: ${{ inputs.api-key }}
        CODEX_RESPONSES_API_ENDPOINT: ${{ inputs.responses-api-endpoint }}
        CODEX_CLI_VERSION: ${{ steps.runtime.outputs.version }}
        CODEX_MODEL: ${{ inputs.model }}
        CODEX_REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        CONTROL: ${{ inputs.controller-path }}
        CONTROL_SHA256: ${{ inputs.control-sha256 }}
        CANDIDATE_DIR: ${{ inputs.candidate-dir }}
        CANDIDATE_SHA256: ${{ inputs.candidate-sha256 }}
        TARGET_REF: ${{ inputs.target-ref }}
        TARGET_KIND: ${{ inputs.target-kind }}
        TARGET_SHA: ${{ inputs.target-sha }}
        CHECKPOINT_DIR: ${{ inputs.checkpoint-dir }}
        CONTINUATION_FILE: ${{ inputs.continuation-file }}
      run: |
        set -euo pipefail
        test "$(sha256sum "${CONTROL}" | cut -d ' ' -f 1)" = "${CONTROL_SHA256}"
        continuation_args=()
        if [[ -n "${CONTINUATION_FILE:-}" ]]; then
          continuation_args+=(-continuation-file "${CONTINUATION_FILE}")
        fi
        "${CONTROL}" repair \
          -repo-root "${GITHUB_WORKSPACE}" \
          -module-root "${GITHUB_WORKSPACE}/codexsdk" \
          -candidate-dir "${CANDIDATE_DIR}" \
          -candidate-sha256 "${CANDIDATE_SHA256}" \
          -target-ref "${TARGET_REF}" \
          -target-kind "${TARGET_KIND}" \
          -target-sha "${TARGET_SHA}" \
          -checkpoint-dir "${CHECKPOINT_DIR}" \
          "${continuation_args[@]}"

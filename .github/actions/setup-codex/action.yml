name: Set up official Codex
description: Select an accepted-base or latest release, then install and verify that exact stable CLI.
inputs:
  accepted-base:
    description: Exact trusted controller commit whose accepted baseline selects the upgrade executor. Empty selects latest for Live.
    default: ""
outputs:
  version:
    description: Exact official CLI version selected and installed for this run.
    value: ${{ steps.runtime.outputs.version }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"
    - name: Resolve and install official Codex
      id: runtime
      shell: bash
      env:
        ACCEPTED_BASE: ${{ inputs.accepted-base }}
      run: |
        set -euo pipefail
        if [[ -n "${ACCEPTED_BASE}" ]]; then
          [[ "${ACCEPTED_BASE}" =~ ^[0-9a-f]{40}$ ]]
          version="$(git show "${ACCEPTED_BASE}:codexsdk/internal/protocolschema/appserver/v2/baseline_metadata.json" |
            jq -er '.codex_version | capture("^codex-cli (?<version>(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*))$").version')"
          echo "codex_runtime_accepted_base=${ACCEPTED_BASE}"
        else
          version="$(go run ./internal/tools/cmd/livecodex version)"
        fi
        npm install --global --registry=https://registry.npmjs.org "@openai/codex@${version}"
        observed="$(codex --version)"
        test "${observed}" = "codex-cli ${version}"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
        echo "codex_runtime_release=${version}"
        echo "codex_runtime_observed=${observed}"

name: Verify generated protocol artifacts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated:
    name: Generated reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check generated artifacts
        working-directory: codexsdk
        env:
          GOTOOLCHAIN: local
        run: go run ./internal/cmd/generatedcheck

      - name: Worktree remains clean
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          git diff --check
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short >&2
            echo "generated check left a dirty worktree" >&2
            exit 1
          fi

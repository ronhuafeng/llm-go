name: Verify generated protocol artifacts

on:
  workflow_call:
    inputs:
      repository:
        description: Repository containing the exact revision to verify.
        required: false
        type: string
      ref:
        description: Exact commit SHA to verify.
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated:
    name: Generated reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify generated through shared gate
        id: goal_gate
        env:
          GOTOOLCHAIN: local
        run: |
          set +e
          path="$(python3 .github/scripts/verify-protocol-gate.py generated)"
          status=$?
          echo "path=${path}" >> "${GITHUB_OUTPUT}"
          echo "head=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          exit "${status}"

      - name: Retain complete generated diagnostics
        if: ${{ always() && !cancelled() && steps.goal_gate.outputs.path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protocol-goal-generated-${{ steps.goal_gate.outputs.head }}-${{ github.run_attempt }}
          path: ${{ steps.goal_gate.outputs.path }}
          if-no-files-found: error

      - name: Worktree remains clean
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short >&2
            echo "generated check left a dirty worktree" >&2
            exit 1
          fi

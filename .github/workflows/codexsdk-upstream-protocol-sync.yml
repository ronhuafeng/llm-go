name: Codex Upstream Protocol Sync
run-name: "Protocol sync ${{ inputs.upstream_ref || 'latest stable' }}"

on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Optional openai/codex tag, ref, or full SHA. Defaults to the latest stable rust-vX.Y.Z tag."
        required: false
        type: string
      allow_downgrade:
        description: "Allow an explicit stable rust-vX.Y.Z target older than the current stable-tag baseline."
        required: false
        type: boolean
        default: false
      force_compare:
        description: "Generate drift artifacts even when baseline metadata already points at the selected upstream target."
        required: false
        type: boolean
        default: false
      validation_only:
        description: "Run mechanical sync and local validation from the current open PR without committing or publishing protocol changes."
        required: false
        type: boolean
        default: false

concurrency:
  group: codex-upstream-protocol-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream protocol
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read
    outputs:
      outcome: ${{ steps.mechanical.outputs.outcome }}
      applied: ${{ steps.mechanical.outputs.applied }}
      target_ref: ${{ steps.mechanical.outputs.target_ref }}
      target_kind: ${{ steps.mechanical.outputs.target_kind }}
      target_sha: ${{ steps.mechanical.outputs.target_sha }}
      restore_candidate: ${{ steps.evidence.outputs.restore_candidate }}
      restore_worktree: ${{ steps.evidence.outputs.restore_worktree }}
    steps:
      - name: Guard control-plane ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_ONLY: ${{ inputs.validation_only || false }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            exit 0
          fi
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" || "${VALIDATION_ONLY}" != "true" ]]; then
            echo "Refusing to run protocol sync from ${GITHUB_REF_NAME}; use ${DEFAULT_BRANCH} or validation_only from an open PR." >&2
            exit 1
          fi

          matching_prs="$(
            gh pr list \
              --repo "${GH_REPO}" \
              --state open \
              --base "${DEFAULT_BRANCH}" \
              --head "${GITHUB_REF_NAME}" \
              --json headRefOid,headRepository \
              --jq '[.[] | select(.headRefOid == env.GITHUB_SHA and .headRepository.nameWithOwner == env.GH_REPO)] | length'
          )"
          if [[ "${matching_prs}" != "1" ]]; then
            echo "validation_only requires exactly one open same-repository PR from ${GITHUB_REF_NAME} at ${GITHUB_SHA}." >&2
            exit 1
          fi

      - name: Check out trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: codexsdk/go.mod
          cache: false

      - name: Provision Codex schema build dependencies
        run: |
          set -euo pipefail
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - name: Guard clean protocol worktree
        working-directory: codexsdk
        run: |
          python3 scripts/codexsdk_sync_changes.py assert-clean \
            --repo-root "${GITHUB_WORKSPACE}"

      - name: Resolve upstream target
        id: target
        working-directory: codexsdk
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade || false }}
          FORCE_COMPARE: ${{ inputs.force_compare || false }}
          REQUESTED_REF: ${{ inputs.upstream_ref || '' }}
          UPSTREAM_REPO: https://github.com/openai/codex.git
        run: |
          set -euo pipefail
          args=(--remote "${UPSTREAM_REPO}" --json)
          if [[ -n "${REQUESTED_REF}" ]]; then
            args+=(--upstream-ref "${REQUESTED_REF}")
          else
            args+=(--latest-stable)
          fi
          python3 scripts/codexsdk_resolve_upstream.py "${args[@]}" > /tmp/codexsdk-target.json
          {
            echo "ref=$(jq -r '.ref_name' /tmp/codexsdk-target.json)"
            echo "kind=$(jq -r '.ref_kind' /tmp/codexsdk-target.json)"
            echo "sha=$(jq -r '.peeled_commit_sha' /tmp/codexsdk-target.json)"
            echo "explicit=$(jq -r '.target_explicit' /tmp/codexsdk-target.json)"
          } >> "${GITHUB_OUTPUT}"

          mkdir -p .cache/codexsdk-sync
          jq \
            --arg allow_downgrade "${ALLOW_DOWNGRADE}" \
            --arg force_compare "${FORCE_COMPARE}" \
            --arg upstream_repo "${UPSTREAM_REPO}" \
            '{
              target_ref: .ref_name,
              target_kind: .ref_kind,
              target_sha: .peeled_commit_sha,
              target_explicit: .target_explicit,
              allow_downgrade: ($allow_downgrade == "true"),
              force_compare: ($force_compare == "true"),
              upstream_repo: $upstream_repo
            }' /tmp/codexsdk-target.json > .cache/codexsdk-sync/action-inputs.json

      - name: Run mechanical protocol sync
        id: mechanical
        working-directory: codexsdk
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 scripts/codexsdk_mechanical_sync.py --repo-root "${GITHUB_WORKSPACE}"

      - name: Pack sync evidence
        id: evidence
        if: always() && !cancelled()
        working-directory: codexsdk
        env:
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY_SHA: ${{ github.sha }}
          TARGET_REF: ${{ steps.mechanical.outputs.target_ref || steps.target.outputs.ref }}
          TARGET_KIND: ${{ steps.mechanical.outputs.target_kind || steps.target.outputs.kind }}
          TARGET_SHA: ${{ steps.mechanical.outputs.target_sha || steps.target.outputs.sha }}
          OUTCOME: ${{ steps.mechanical.outputs.outcome }}
          APPLIED: ${{ steps.mechanical.outputs.applied }}
          CANDIDATE: ${{ steps.mechanical.outputs.candidate }}
          HEAD_BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          VALIDATION_ONLY: ${{ inputs.validation_only || false }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/protocol-sync-evidence"
          args=(
            pack
            --out "${RUNNER_TEMP}/protocol-sync-evidence"
            --repo-root "${GITHUB_WORKSPACE}"
            --repository "${GH_REPO}"
            --run-id "${RUN_ID}"
            --repository-sha "${REPOSITORY_SHA}"
            --head-branch "${HEAD_BRANCH}"
            --event "${EVENT_NAME}"
            --candidate "${CANDIDATE}"
          )
          if [[ -n "${TARGET_REF}" ]]; then
            args+=(--target-ref "${TARGET_REF}")
          fi
          if [[ -n "${TARGET_KIND}" ]]; then
            args+=(--target-kind "${TARGET_KIND}")
          fi
          if [[ -n "${TARGET_SHA}" ]]; then
            args+=(--target-sha "${TARGET_SHA}")
          fi
          if [[ -n "${OUTCOME}" ]]; then
            args+=(--outcome "${OUTCOME}")
          fi
          if [[ "${APPLIED}" == "true" ]]; then
            args+=(--applied)
          fi
          if [[ "${VALIDATION_ONLY}" == "true" ]]; then
            args+=(--validation-only)
          fi
          python3 scripts/codexsdk_repair_evidence.py "${args[@]}"

      - name: Upload protocol sync evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-sync-evidence
          path: ${{ runner.temp }}/protocol-sync-evidence
          if-no-files-found: ignore

      - name: Upload protocol candidate
        if: always() && !cancelled() && steps.evidence.outputs.restore_candidate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: protocol-candidate
          path: ${{ runner.temp }}/protocol-sync-evidence/schema
          if-no-files-found: error

      - name: Upload protocol worktree
        if: always() && !cancelled() && steps.evidence.outputs.restore_worktree == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: protocol-worktree
          path: ${{ runner.temp }}/protocol-sync-evidence/protocol-worktree.patch
          if-no-files-found: error

  proof:
    name: Protocol proof
    needs: sync
    uses: ./.github/workflows/codexsdk-protocol-proof.yml
    with:
      repository-sha: ${{ github.sha }}
      target-ref: ${{ needs.sync.outputs.target_ref }}
      target-sha: ${{ needs.sync.outputs.target_sha }}
      restore-worktree: ${{ needs.sync.outputs.restore_worktree == 'true' }}
      restore-candidate: ${{ needs.sync.outputs.restore_candidate == 'true' }}

  publish:
    name: Publish metadata-sync PR
    needs: [sync, proof]
    if: ${{ needs.sync.outputs.applied == 'true' && inputs.validation_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore applied worktree
        if: needs.sync.outputs.restore_worktree == 'true'
        uses: actions/download-artifact@v4
        with:
          name: protocol-worktree
          path: ${{ runner.temp }}/protocol-worktree

      - name: Apply worktree patch
        if: needs.sync.outputs.restore_worktree == 'true'
        run: git apply --binary "${RUNNER_TEMP}/protocol-worktree/protocol-worktree.patch"

      - name: Confirm generated baseline provenance
        working-directory: codexsdk
        env:
          RESOLVED_TARGET_KIND: ${{ needs.sync.outputs.target_kind }}
          RESOLVED_TARGET_REF: ${{ needs.sync.outputs.target_ref }}
          RESOLVED_TARGET_SHA: ${{ needs.sync.outputs.target_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("internal/protocolschema/appserver/v2/baseline_metadata.json").read_text(encoding="utf-8"))
          expected = {
              "source_ref_name": os.environ["RESOLVED_TARGET_REF"],
              "source_ref_kind": os.environ["RESOLVED_TARGET_KIND"],
              "source_commit": os.environ["RESOLVED_TARGET_SHA"],
          }
          for key, value in expected.items():
              actual = str(metadata.get(key) or "")
              if actual != value:
                  raise SystemExit(f"protocol implementation {key}={actual!r}, expected {value!r}")
          PY

      - name: Capture final protocol changes
        working-directory: codexsdk
        run: |
          python3 scripts/codexsdk_sync_changes.py capture \
            --repo-root "${GITHUB_WORKSPACE}" \
            --phase final \
            --output /tmp/codexsdk-final-changes.json

      - name: Commit validated protocol implementation
        id: commit
        working-directory: codexsdk
        env:
          TARGET_KIND: ${{ needs.sync.outputs.target_kind }}
          TARGET_REF: ${{ needs.sync.outputs.target_ref }}
          TARGET_SHA: ${{ needs.sync.outputs.target_sha }}
        run: |
          set -euo pipefail
          python3 scripts/codexsdk_sync_changes.py stage \
            --repo-root "${GITHUB_WORKSPACE}" \
            --manifest /tmp/codexsdk-final-changes.json
          git diff --cached --check
          git -c user.name="codexsdk-sync-bot" \
            -c user.email="codexsdk-sync-bot@users.noreply.github.com" \
            commit \
            -m "Sync Codex protocol baseline to ${TARGET_REF}" \
            -m "Upstream-ref: ${TARGET_REF}" \
            -m "Upstream-ref-kind: ${TARGET_KIND}" \
            -m "Upstream-commit: ${TARGET_SHA}"
          echo "validated_commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Publish protected sync PR
        working-directory: codexsdk
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_KIND: ${{ needs.sync.outputs.target_kind }}
          TARGET_REF: ${{ needs.sync.outputs.target_ref }}
          TARGET_SHA: ${{ needs.sync.outputs.target_sha }}
          VALIDATED_COMMIT: ${{ steps.commit.outputs.validated_commit }}
        run: |
          set -euo pipefail
          gh auth status
          gh auth setup-git
          scripts/codexsdk_publish_sync_pr.sh \
            --land-ref "${DEFAULT_BRANCH}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --branch-prefix "codex/sync-upstream/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target-ref "${TARGET_REF}" \
            --target-kind "${TARGET_KIND}" \
            --target-sha "${TARGET_SHA}" \
            --sync-mode metadata-sync \
            --validated-commit "${VALIDATED_COMMIT}"

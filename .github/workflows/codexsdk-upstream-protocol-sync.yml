name: Codex Upstream Protocol Sync
run-name: "Native upstream goal ${{ inputs.upstream_ref || 'latest stable' }}"

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Exact upstream tag/ref/SHA; empty selects latest stable once."
        type: string
        required: false
      allow_downgrade:
        description: "Allow an explicit older stable tag in read-only diagnosis."
        type: boolean
        default: false
      force_compare:
        description: "Rebuild the recorded baseline for validation_only."
        type: boolean
        default: false
      diagnostic_only:
        description: "Read-only generation and planning, without a goal or publication."
        type: boolean
        default: false
      validation_only:
        description: "Read-only exact baseline rebuild; requires force_compare."
        type: boolean
        default: false

concurrency:
  group: codex-upstream-protocol-sync
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.diagnostic_only == true || inputs.validation_only == true) }}
    name: Read-only upstream protocol
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read
    outputs:
      outcome: ${{ steps.exact.outputs.outcome || steps.diagnostic.outputs.outcome }}
      stage: ${{ steps.exact.outputs.stage || steps.diagnostic.outputs.stage }}
      category: ${{ steps.exact.outputs.failure_category || steps.diagnostic.outputs.failure_category }}
      target_ref: ${{ steps.exact.outputs.target_ref || steps.diagnostic.outputs.target_ref }}
      target_sha: ${{ steps.exact.outputs.target_sha || steps.diagnostic.outputs.target_sha }}
    steps:
      - name: Guard diagnostic ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only == true }}
          VALIDATION_ONLY: ${{ inputs.validation_only == true }}
          FORCE_COMPARE: ${{ inputs.force_compare == true }}
        run: |
          set -euo pipefail
          if [[ "${DIAGNOSTIC_ONLY}" == "true" && "${VALIDATION_ONLY}" == "true" ]]; then
            echo 'diagnostic_only and validation_only are mutually exclusive.' >&2
            exit 1
          fi
          if [[ "${VALIDATION_ONLY}" == "true" && "${FORCE_COMPARE}" != "true" ]]; then
            echo 'validation_only requires force_compare=true.' >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            exit 0
          fi
          matching_prs="$(
            gh pr list \
              --repo "${GH_REPO}" \
              --state open \
              --base "${DEFAULT_BRANCH}" \
              --head "${GITHUB_REF_NAME}" \
              --json headRefOid,headRepository \
              --jq '[.[] | select(.headRefOid == env.GITHUB_SHA and .headRepository.nameWithOwner == env.GH_REPO)] | length'
          )"
          test "${matching_prs}" = 1

      - name: Check out diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Provision Codex schema build dependencies
        run: |
          set -euo pipefail
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap \
            clang \
            cmake \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - name: Generate and plan candidate
        id: diagnostic
        if: ${{ inputs.diagnostic_only == true }}
        working-directory: codexsdk
        env:
          GOTOOLCHAIN: local
          REQUESTED_REF: ${{ inputs.upstream_ref || '' }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade || false }}
        run: |
          set -euo pipefail
          args=(
            diagnose
            -repo-root "${GITHUB_WORKSPACE}"
            -module-root .
            -upstream-repo https://github.com/openai/codex.git
            -event-name "${GITHUB_EVENT_NAME}"
          )
          if [[ -n "${REQUESTED_REF}" ]]; then
            args+=(-upstream-ref "${REQUESTED_REF}")
          fi
          if [[ "${ALLOW_DOWNGRADE}" == "true" ]]; then
            args+=(-allow-downgrade)
          fi
          go run ./internal/cmd/protocolupgrade "${args[@]}" -json
          git -C "${GITHUB_WORKSPACE}" diff --exit-code
          test -z "$(git -C "${GITHUB_WORKSPACE}" status --porcelain --untracked-files=normal)"

      - name: Summarize read-only diagnosis
        if: ${{ always() && inputs.diagnostic_only == true }}
        env:
          TARGET_REF: ${{ steps.diagnostic.outputs.target_ref }}
          TARGET_SHA: ${{ steps.diagnostic.outputs.target_sha }}
          OUTCOME: ${{ steps.diagnostic.outputs.outcome }}
          ISSUE_STAGE: ${{ steps.diagnostic.outputs.issue_stage }}
          ISSUE_PATH: ${{ steps.diagnostic.outputs.issue_path }}
          ISSUE_REASON: ${{ steps.diagnostic.outputs.issue_reason }}
          REASON: ${{ steps.diagnostic.outputs.reason }}
        run: |
          {
            echo '## Read-only upstream Plan diagnosis'
            echo
            echo "- Repository commit: ${GITHUB_SHA}"
            echo "- Workflow run/attempt: ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
            echo "- Upstream ref: ${TARGET_REF}"
            echo "- Upstream peeled commit: ${TARGET_SHA}"
            echo '- Generation: cargo run --locked -p codex-cli -- app-server generate-json-schema --experimental --out <complete-schema>; cargo run --locked -p codex-cli -- app-server generate-json-schema --out <stable-schema> (both from that commit)'
            echo "- Plan outcome: ${OUTCOME:-unavailable}"
            echo "- Reason: ${REASON}"
            echo "- Stage: ${ISSUE_STAGE}"
            echo "- Path: ${ISSUE_PATH}"
            echo "- Unresolved reason: ${ISSUE_REASON}"
            echo '- Agent, Apply, commit, and publication: not invoked'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify exact accepted baseline
        id: exact
        if: ${{ inputs.validation_only == true && inputs.diagnostic_only != true }}
        working-directory: codexsdk
        env:
          GOTOOLCHAIN: local
          REQUESTED_REF: ${{ inputs.upstream_ref || '' }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade || false }}
        run: |
          set -euo pipefail
          args=(
            sync
            -repo-root "${GITHUB_WORKSPACE}"
            -module-root .
            -upstream-repo https://github.com/openai/codex.git
            -event-name "${GITHUB_EVENT_NAME}"
            -force-compare
            -validation-only
          )
          if [[ -n "${REQUESTED_REF}" ]]; then
            args+=(-upstream-ref "${REQUESTED_REF}")
          fi
          if [[ "${ALLOW_DOWNGRADE}" == "true" ]]; then
            args+=(-allow-downgrade)
          fi
          go run ./internal/cmd/protocolupgrade "${args[@]}"
          git -C "${GITHUB_WORKSPACE}" diff --exit-code
          test -z "$(git -C "${GITHUB_WORKSPACE}" status --porcelain --untracked-files=normal)"

      - name: Summarize exact baseline validation
        if: ${{ always() && inputs.validation_only == true && inputs.diagnostic_only != true }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ steps.exact.outputs.target_ref }}
          TARGET_SHA: ${{ steps.exact.outputs.target_sha }}
          OUTCOME: ${{ steps.exact.outputs.outcome }}
          REASON: ${{ steps.exact.outputs.reason }}
        run: |
          set -euo pipefail
          merge_candidate='not applicable to default branch'
          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            pr_number="$(
              gh pr list --repo "${GH_REPO}" --state open \
                --base "${DEFAULT_BRANCH}" --head "${GITHUB_REF_NAME}" \
                --json number,headRefOid \
                --jq '[.[] | select(.headRefOid == env.GITHUB_SHA) | .number][0] // empty'
            )"
            if [[ -n "${pr_number}" ]]; then
              merge_candidate="$(gh api "repos/${GH_REPO}/git/ref/pull/${pr_number}/merge" --jq .object.sha)"
            else
              merge_candidate='PR head changed during validation; no current merge candidate for this head'
            fi
          fi
          {
            echo '## Exact upstream baseline validation'
            echo
            echo "- Workflow run/attempt: ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
            echo "- Validated PR head H: ${GITHUB_SHA}"
            echo "- PR merge candidate at summary time (separate PR verification): ${merge_candidate}"
            echo "- Exact upstream ref: ${TARGET_REF}"
            echo "- Exact upstream commit: ${TARGET_SHA}"
            echo "- Rebuild outcome: ${OUTCOME:-unavailable}"
            echo "- Rebuild reason: ${REASON}"
            echo '- Agent, accepted-worktree Apply, commit, push, and PR publication: not invoked'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain selected build inputs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protocol-sync-build-inputs-readonly
          path: |
            codexsdk/.cache/codexsdk-upstream-*/upstream.Cargo.lock
            codexsdk/.cache/codexsdk-upstream-*/prepared.Cargo.lock
          include-hidden-files: true
          if-no-files-found: ignore

  sync:
    if: ${{ inputs.diagnostic_only != true && inputs.validation_only != true }}
    name: One native upstream goal
    outputs:
      pr_number: ${{ steps.ready.outputs.pr_number }}
      expected_head: ${{ steps.ready.outputs.expected_head }}
      verification_base: ${{ steps.ready.outputs.verification_base }}
      original_base: ${{ steps.ready.outputs.original_base }}
      target_ref: ${{ steps.ready.outputs.target_ref }}
      target_kind: ${{ steps.ready.outputs.target_kind }}
      target_sha: ${{ steps.ready.outputs.target_sha }}
      deadline: ${{ steps.ready.outputs.deadline }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - name: Require accepted main control
        id: start
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}"
          # Rerunning this job would allocate a new goal/deadline. Reconcile any
          # retained Draft binding explicitly instead of silently repeating it.
          test "${GITHUB_RUN_ATTEMPT}" = 1
          echo "deadline=$(date -u -d '+350 minutes' +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Select target and avoid duplicate upstream goals
        id: preflight
        env:
          REQUESTED_REF: ${{ inputs.upstream_ref || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          APP_BOT_ID: ${{ vars.PROTOCOL_SYNC_APP_BOT_ID }}
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          control="${RUNNER_TEMP}/protocolupgrade"
          go build -o "${control}" ./codexsdk/internal/cmd/protocolupgrade
          args=(goal-preflight -controller-root "${GITHUB_WORKSPACE}"
            -repository "${GITHUB_REPOSITORY}" -base-branch "${DEFAULT_BRANCH}"
            -base-sha "${GITHUB_SHA}" -app-bot-id "${APP_BOT_ID}")
          if [[ -n "${REQUESTED_REF}" ]]; then args+=(-upstream-ref "${REQUESTED_REF}"); fi
          "${control}" "${args[@]}" > "${RUNNER_TEMP}/goal-preflight.json"
          outcome="$(jq -er '.Outcome | select(. == "run" or . == "skip")' "${RUNNER_TEMP}/goal-preflight.json")"
          echo "outcome=${outcome}" >> "${GITHUB_OUTPUT}"
      - name: Summarize skipped upstream goal
        if: ${{ steps.preflight.outputs.outcome == 'skip' }}
        run: |
          {
            echo '## Upstream goal not started'
            jq -r '.Reason, ("Selected target: " + .Target.RefName + " (" + .Target.PeeledCommitSHA + ")"),
              (if .ExistingPRURL != "" then "Existing PR: " + .ExistingPRURL else empty end)' "${RUNNER_TEMP}/goal-preflight.json"
            echo 'No schema build, model goal, or publication was invoked.'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Provision native build and sandbox prerequisites
        if: ${{ steps.preflight.outputs.outcome == 'run' }}
        id: sandbox_host
        env:
          HOSTED_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "${HOSTED_ENVIRONMENT}" = github-hosted
          sudo apt-get update
          sudo apt-get install -y bubblewrap clang cmake libasound2-dev libssl-dev pkg-config protobuf-compiler
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          rustup default stable
      - name: Set up official Codex latest once
        if: ${{ steps.preflight.outputs.outcome == 'run' }}
        id: runtime
        uses: ./.github/actions/setup-codex
      - name: Build trusted launcher and warm exact source inputs
        if: ${{ steps.preflight.outputs.outcome == 'run' }}
        id: prepare
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          control="${RUNNER_TEMP}/protocolupgrade"
          selected="${RUNNER_TEMP}/goal-preflight.json"
          args=(diagnose -repo-root "${GITHUB_WORKSPACE}" -module-root "${GITHUB_WORKSPACE}/codexsdk"
            -event-name "${GITHUB_EVENT_NAME}" -upstream-ref "$(jq -er .Target.RefName "${selected}")" -json)
          "${control}" "${args[@]}" > "${RUNNER_TEMP}/goal-source.json"
          # A moved tag/ref must not silently change this run's selected target.
          jq -e --slurpfile selected "${selected}" '
            .Target as $actual | $selected[0].Target as $expected |
            $actual.RefName == $expected.RefName and
            $actual.RefKind == $expected.RefKind and
            $actual.PeeledCommitSHA == $expected.PeeledCommitSHA
          ' "${RUNNER_TEMP}/goal-source.json" > /dev/null
          target_ref="$(jq -r .Target.RefName "${RUNNER_TEMP}/goal-source.json")"
          target_kind="$(jq -r .Target.RefKind "${RUNNER_TEMP}/goal-source.json")"
          if [[ "${target_kind}" == stable_rust_tag ]]; then
            git -C codexsdk/.cache/openai-codex fetch --no-tags origin "refs/tags/${target_ref}:refs/tags/${target_ref}"
          fi
          # Warm dependency-test modules required by the offline tidy gate too.
          go mod tidy -diff
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
          workspace="${RUNNER_TEMP}/goal-candidate"
          git clone --no-hardlinks --no-local "${GITHUB_WORKSPACE}" "${workspace}"
          git -C "${workspace}" checkout --detach "${GITHUB_SHA}"
          git -C "${workspace}" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          cp -a codexsdk/.cache "${workspace}/codexsdk/"
          mkdir -p "${RUNNER_TEMP}/goal-diagnostics" "${RUNNER_TEMP}/goal-state" "${RUNNER_TEMP}/goal-rust-tools"
          cp "$(command -v rustup)" "${RUNNER_TEMP}/goal-rust-tools/rustup"
          for tool in cargo rustc rustdoc; do ln -s rustup "${RUNNER_TEMP}/goal-rust-tools/${tool}"; done
          echo "control=${control}" >> "${GITHUB_OUTPUT}"
          echo "workspace=${workspace}" >> "${GITHUB_OUTPUT}"
      - name: Mint existing repository-scoped publication identity
        if: ${{ steps.preflight.outputs.outcome == 'run' }}
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PROTOCOL_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Prepare and bind one Draft PR
        if: ${{ steps.preflight.outputs.outcome == 'run' }}
        id: draft
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_BOT_ID: ${{ vars.PROTOCOL_SYNC_APP_BOT_ID }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONTROL: ${{ steps.prepare.outputs.control }}
        run: |
          set -euo pipefail
          git config --local credential.helper '!gh auth git-credential'
          "${CONTROL}" goal-prepare -controller-root "${GITHUB_WORKSPACE}" \
            -repository "${GITHUB_REPOSITORY}" -base-branch "${DEFAULT_BRANCH}" \
            -base-sha "${GITHUB_SHA}" -app-bot-id "${APP_BOT_ID}" \
            -target-ref "$(jq -r .Target.RefName "${RUNNER_TEMP}/goal-source.json")" \
            -target-kind "$(jq -r .Target.RefKind "${RUNNER_TEMP}/goal-source.json")" \
            -target-sha "$(jq -r .Target.PeeledCommitSHA "${RUNNER_TEMP}/goal-source.json")" \
            > "${RUNNER_TEMP}/goal-binding.json"
      - name: Run the complete goal with its fixed verification tool
        if: ${{ steps.preflight.outputs.outcome == 'run' }}
        id: goal
        env:
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROTOCOL_SYNC_APP_CLIENT_ID: ${{ vars.PROTOCOL_SYNC_APP_CLIENT_ID }}
          PROTOCOL_SYNC_APP_INSTALLATION_ID: ${{ steps.app_token.outputs.installation-id }}
          PROTOCOL_SYNC_APP_PRIVATE_KEY: ${{ secrets.PROTOCOL_SYNC_APP_PRIVATE_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          CODEX_RESPONSES_API_ENDPOINT: ${{ secrets.CODEX_RESPONSES_API_ENDPOINT }}
          CODEX_CLI_VERSION: ${{ steps.runtime.outputs.version }}
          APP_BOT_ID: ${{ vars.PROTOCOL_SYNC_APP_BOT_ID }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONTROL: ${{ steps.prepare.outputs.control }}
          CANDIDATE: ${{ steps.prepare.outputs.workspace }}
          DEADLINE: ${{ steps.start.outputs.deadline }}
        run: |
          set -euo pipefail
          binding="${RUNNER_TEMP}/goal-binding.json"
          source="${RUNNER_TEMP}/goal-source.json"
          "${CONTROL}" goal -controller-root "${GITHUB_WORKSPACE}" -workspace "${CANDIDATE}" \
            -state-dir "${RUNNER_TEMP}/goal-state" -diagnostic-dir "${RUNNER_TEMP}/goal-diagnostics" \
            -repository "${GITHUB_REPOSITORY}" -base-branch "${DEFAULT_BRANCH}" -base-sha "${GITHUB_SHA}" \
            -pr-number "$(jq -r .number "${binding}")" -branch "$(jq -r .branch "${binding}")" \
            -expected-head "$(jq -r .head "${binding}")" -app-bot-id "${APP_BOT_ID}" \
            -target-ref "$(jq -r .Target.RefName "${source}")" -target-kind "$(jq -r .Target.RefKind "${source}")" \
            -target-sha "$(jq -r .Target.PeeledCommitSHA "${source}")" \
            -candidate-dir "$(jq -r .CandidateDir "${source}")" -runtime-dirs "${RUNNER_TEMP}/goal-rust-tools" -timeout 300m \
            -deadline "${DEADLINE}" -handoff-file "${RUNNER_TEMP}/goal-handoff.json" \
            > "${RUNNER_TEMP}/goal-result.json"
      - name: Mint fresh Ready identity after trusted completion
        id: ready_token
        if: ${{ success() && steps.goal.outcome == 'success' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PROTOCOL_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: Revalidate accepted head and mark Ready
        id: ready
        if: ${{ success() && steps.goal.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.ready_token.outputs.token }}
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROL: ${{ steps.prepare.outputs.control }}
        run: |
          set -euo pipefail
          "${CONTROL}" goal-ready -controller-root "${GITHUB_WORKSPACE}" \
            -handoff-file "${RUNNER_TEMP}/goal-handoff.json" > "${RUNNER_TEMP}/goal-ready.json"
          jq -r 'to_entries[] | select(.key == "pr_number" or .key == "expected_head" or .key == "original_base" or .key == "verification_base" or .key == "target_ref" or .key == "target_kind" or .key == "target_sha" or .key == "deadline") | "\(.key)=\(.value)"' "${RUNNER_TEMP}/goal-ready.json" >> "${GITHUB_OUTPUT}"
      - name: Preserve bounded goal evidence
        id: evidence
        if: ${{ always() && steps.preflight.outputs.outcome != 'skip' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protocol-native-goal-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/goal-preflight.json
            ${{ runner.temp }}/goal-source.json
            ${{ runner.temp }}/goal-binding.json
            ${{ runner.temp }}/goal-result.json
            ${{ runner.temp }}/goal-handoff.json
            ${{ runner.temp }}/goal-ready.json
            ${{ runner.temp }}/goal-diagnostics/*.jsonl
          if-no-files-found: warn
      - name: Summarize upstream goal outcome
        if: ${{ always() && steps.preflight.outputs.outcome != 'skip' }}
        env:
          GOAL_OUTCOME: ${{ steps.goal.outcome }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id || '0' }}
        run: |
          set -euo pipefail
          control="${RUNNER_TEMP}/protocolupgrade"
          if [[ -x "${control}" ]]; then
            "${control}" goal-summary -evidence-dir "${RUNNER_TEMP}" \
              -repository "${GITHUB_REPOSITORY}" -goal-outcome "${GOAL_OUTCOME}" \
              -run-id "${GITHUB_RUN_ID}" -artifact-id "${ARTIFACT_ID}" \
              >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo '## Native upstream goal'
              echo 'The trusted launcher was not built. The native goal did not start.'
              echo "[Inspect setup steps](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

  integrate:
    name: Integrate accepted native goal
    needs: sync
    if: ${{ needs.sync.result == 'success' && needs.sync.outputs.expected_head != '' }}
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    uses: ./.github/workflows/auto-forward.yml
    with:
      pr_number: ${{ fromJSON(needs.sync.outputs.pr_number) }}
      expected_head: ${{ needs.sync.outputs.expected_head }}
      verification_base: ${{ needs.sync.outputs.verification_base }}
      original_base: ${{ needs.sync.outputs.original_base }}
      target_ref: ${{ needs.sync.outputs.target_ref }}
      target_kind: ${{ needs.sync.outputs.target_kind }}
      target_sha: ${{ needs.sync.outputs.target_sha }}
      deadline: ${{ needs.sync.outputs.deadline }}
    secrets:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      CODEX_RESPONSES_API_ENDPOINT: ${{ secrets.CODEX_RESPONSES_API_ENDPOINT }}
      AUTO_FORWARD_APP_PRIVATE_KEY: ${{ secrets.AUTO_FORWARD_APP_PRIVATE_KEY }}

name: Codex Upstream Protocol Sync
run-name: "Protocol sync ${{ inputs.upstream_ref || 'latest stable' }}"

on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Optional openai/codex tag, ref, or full SHA. Defaults to the latest stable rust-vX.Y.Z tag."
        required: false
        type: string
      allow_downgrade:
        description: "Allow an explicit stable rust-vX.Y.Z target older than the current stable-tag baseline."
        required: false
        type: boolean
        default: false
      force_compare:
        description: "Generate drift artifacts even when baseline metadata already points at the selected upstream target."
        required: false
        type: boolean
        default: false
      validation_only:
        description: "Rebuild and verify the exact accepted baseline from an open PR without Agent, Apply, commit, or publication. Requires force_compare."
        required: false
        type: boolean
        default: false
      diagnostic_only:
        description: "Generate the latest stable candidate and run a read-only Plan; never invoke Agent, Apply, checks, or publication."
        required: false
        type: boolean
        default: false

concurrency:
  group: codex-upstream-protocol-sync
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.diagnostic_only == true || inputs.validation_only == true) }}
    name: Read-only upstream protocol
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read
    outputs:
      outcome: ${{ steps.exact.outputs.outcome || steps.diagnostic.outputs.outcome }}
      stage: ${{ steps.exact.outputs.stage || steps.diagnostic.outputs.stage }}
      category: ${{ steps.exact.outputs.failure_category || steps.diagnostic.outputs.failure_category }}
      target_ref: ${{ steps.exact.outputs.target_ref || steps.diagnostic.outputs.target_ref }}
      target_sha: ${{ steps.exact.outputs.target_sha || steps.diagnostic.outputs.target_sha }}
      checks: ${{ steps.exact_checks.outcome }}
    steps:
      - name: Guard diagnostic ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only == true }}
          VALIDATION_ONLY: ${{ inputs.validation_only == true }}
          FORCE_COMPARE: ${{ inputs.force_compare == true }}
        run: |
          set -euo pipefail
          if [[ "${DIAGNOSTIC_ONLY}" == "true" && "${VALIDATION_ONLY}" == "true" ]]; then
            echo 'diagnostic_only and validation_only are mutually exclusive.' >&2
            exit 1
          fi
          if [[ "${VALIDATION_ONLY}" == "true" && "${FORCE_COMPARE}" != "true" ]]; then
            echo 'validation_only requires force_compare=true.' >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            exit 0
          fi
          matching_prs="$(
            gh pr list \
              --repo "${GH_REPO}" \
              --state open \
              --base "${DEFAULT_BRANCH}" \
              --head "${GITHUB_REF_NAME}" \
              --json headRefOid,headRepository \
              --jq '[.[] | select(.headRefOid == env.GITHUB_SHA and .headRepository.nameWithOwner == env.GH_REPO)] | length'
          )"
          test "${matching_prs}" = 1

      - name: Check out diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Provision Codex schema build dependencies
        run: |
          set -euo pipefail
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - name: Generate and plan candidate
        id: diagnostic
        if: ${{ inputs.diagnostic_only == true }}
        working-directory: codexsdk
        env:
          GOTOOLCHAIN: local
          REQUESTED_REF: ${{ inputs.upstream_ref || '' }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade || false }}
        run: |
          set -euo pipefail
          args=(
            diagnose
            -repo-root "${GITHUB_WORKSPACE}"
            -module-root .
            -upstream-repo https://github.com/openai/codex.git
            -event-name "${GITHUB_EVENT_NAME}"
          )
          if [[ -n "${REQUESTED_REF}" ]]; then
            args+=(-upstream-ref "${REQUESTED_REF}")
          fi
          if [[ "${ALLOW_DOWNGRADE}" == "true" ]]; then
            args+=(-allow-downgrade)
          fi
          go run ./internal/cmd/protocolupgrade "${args[@]}" -json
          git -C "${GITHUB_WORKSPACE}" diff --exit-code
          test -z "$(git -C "${GITHUB_WORKSPACE}" status --porcelain --untracked-files=normal)"

      - name: Summarize read-only diagnosis
        if: ${{ always() && inputs.diagnostic_only == true }}
        env:
          TARGET_REF: ${{ steps.diagnostic.outputs.target_ref }}
          TARGET_SHA: ${{ steps.diagnostic.outputs.target_sha }}
          OUTCOME: ${{ steps.diagnostic.outputs.outcome }}
          ISSUE_STAGE: ${{ steps.diagnostic.outputs.issue_stage }}
          ISSUE_PATH: ${{ steps.diagnostic.outputs.issue_path }}
          ISSUE_REASON: ${{ steps.diagnostic.outputs.issue_reason }}
          REASON: ${{ steps.diagnostic.outputs.reason }}
        run: |
          {
            echo '## Read-only upstream Plan diagnosis'
            echo
            echo "- Repository commit: ${GITHUB_SHA}"
            echo "- Workflow run/attempt: ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
            echo "- Upstream ref: ${TARGET_REF}"
            echo "- Upstream peeled commit: ${TARGET_SHA}"
            echo '- Generation: cargo run --locked -p codex-cli -- app-server generate-json-schema --experimental --out <complete-schema>; cargo run --locked -p codex-cli -- app-server generate-json-schema --out <stable-schema> (both from that commit)'
            echo "- Plan outcome: ${OUTCOME:-unavailable}"
            echo "- Reason: ${REASON}"
            echo "- Stage: ${ISSUE_STAGE}"
            echo "- Path: ${ISSUE_PATH}"
            echo "- Unresolved reason: ${ISSUE_REASON}"
            echo '- Agent, Apply, commit, and publication: not invoked'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify exact accepted baseline
        id: exact
        if: ${{ inputs.validation_only == true && inputs.diagnostic_only != true }}
        working-directory: codexsdk
        env:
          GOTOOLCHAIN: local
          REQUESTED_REF: ${{ inputs.upstream_ref || '' }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade || false }}
        run: |
          set -euo pipefail
          args=(
            sync
            -repo-root "${GITHUB_WORKSPACE}"
            -module-root .
            -upstream-repo https://github.com/openai/codex.git
            -event-name "${GITHUB_EVENT_NAME}"
            -force-compare
            -validation-only
          )
          if [[ -n "${REQUESTED_REF}" ]]; then
            args+=(-upstream-ref "${REQUESTED_REF}")
          fi
          if [[ "${ALLOW_DOWNGRADE}" == "true" ]]; then
            args+=(-allow-downgrade)
          fi
          go run ./internal/cmd/protocolupgrade "${args[@]}"
          git -C "${GITHUB_WORKSPACE}" diff --exit-code
          test -z "$(git -C "${GITHUB_WORKSPACE}" status --porcelain --untracked-files=normal)"

      - name: Check exact baseline and Go source
        id: exact_checks
        if: ${{ inputs.validation_only == true && inputs.diagnostic_only != true }}
        working-directory: codexsdk
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          go run ./internal/cmd/protocolupgrade check -module-root .
          git -C "${GITHUB_WORKSPACE}" diff --check
          test -z "$(git -C "${GITHUB_WORKSPACE}" ls-files -z -- 'codexsdk/*.go' 'codexsdk/**/*.go' | xargs -0 -r -I{} gofmt -l "${GITHUB_WORKSPACE}/{}")"
          go vet ./...
          go test ./...

      - name: Summarize exact baseline validation
        if: ${{ always() && inputs.validation_only == true && inputs.diagnostic_only != true }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ steps.exact.outputs.target_ref }}
          TARGET_SHA: ${{ steps.exact.outputs.target_sha }}
          OUTCOME: ${{ steps.exact.outputs.outcome }}
          REASON: ${{ steps.exact.outputs.reason }}
          CHECKS_OUTCOME: ${{ steps.exact_checks.outcome }}
        run: |
          set -euo pipefail
          merge_candidate='not applicable to default branch'
          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            pr_number="$(
              gh pr list --repo "${GH_REPO}" --state open \
                --base "${DEFAULT_BRANCH}" --head "${GITHUB_REF_NAME}" \
                --json number,headRefOid \
                --jq '[.[] | select(.headRefOid == env.GITHUB_SHA) | .number][0] // empty'
            )"
            if [[ -n "${pr_number}" ]]; then
              merge_candidate="$(gh api "repos/${GH_REPO}/git/ref/pull/${pr_number}/merge" --jq .object.sha)"
            else
              merge_candidate='PR head changed during validation; no current merge candidate for this head'
            fi
          fi
          {
            echo '## Exact upstream baseline validation'
            echo
            echo "- Workflow run/attempt: ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
            echo "- Validated PR head H: ${GITHUB_SHA}"
            echo "- PR merge candidate at summary time (separate PR verification): ${merge_candidate}"
            echo "- Exact upstream ref: ${TARGET_REF}"
            echo "- Exact upstream commit: ${TARGET_SHA}"
            echo "- Rebuild outcome: ${OUTCOME:-unavailable}"
            echo "- Rebuild reason: ${REASON}"
            echo "- Go checks outcome: ${CHECKS_OUTCOME}"
            echo '- Agent, accepted-worktree Apply, commit, push, and PR publication: not invoked'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain selected build inputs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-sync-build-inputs-readonly
          path: |
            codexsdk/.cache/codexsdk-upstream-*/upstream.Cargo.lock
            codexsdk/.cache/codexsdk-upstream-*/prepared.Cargo.lock
          include-hidden-files: true
          if-no-files-found: ignore

  sync:
    if: ${{ inputs.diagnostic_only != true && inputs.validation_only != true }}
    name: Sync upstream protocol
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      outcome: ${{ steps.mechanical.outputs.outcome }}
      resume_outcome: ${{ steps.resume.outputs.outcome }}
      target_ref: ${{ steps.mechanical.outputs.target_ref }}
      target_kind: ${{ steps.mechanical.outputs.target_kind }}
      target_sha: ${{ steps.mechanical.outputs.target_sha }}
      publication_head: ${{ steps.mechanical.outputs.publication_head }}
      publication_branch: ${{ steps.mechanical.outputs.publication_branch }}
      publication_checks: ${{ steps.mechanical.outputs.publication_checks }}
      pr_url: ${{ steps.mechanical.outputs.pr_url }}
      patch_sha256: ${{ steps.handoff.outputs.patch_sha256 }}
      stage: ${{ steps.resume.outputs.stage || steps.mechanical.outputs.stage }}
      category: ${{ steps.resume.outputs.failure_category || steps.mechanical.outputs.failure_category }}
      checks: ${{ steps.checks.outcome }}
      agent: ${{ steps.codex.outcome }}
      scope: ${{ steps.final_scope.outcome == 'failure' && 'failure' || steps.proposal_scope.outcome }}
      handoff: ${{ steps.handoff.outcome }}
    steps:
      - name: Guard control-plane ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            exit 0
          fi
          echo "Refusing to run write-capable protocol sync from ${GITHUB_REF_NAME}; use ${DEFAULT_BRANCH}." >&2
          exit 1

      - name: Check out trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Provision Codex schema build dependencies
        run: |
          set -euo pipefail
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - name: Build trusted publication control
        id: control
        working-directory: codexsdk
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          control="${RUNNER_TEMP}/protocolupgrade-control"
          go build -o "${control}" ./internal/cmd/protocolupgrade
          digest="$(sha256sum "${control}" | cut -d ' ' -f1)"
          echo "sha256=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Plan/apply native protocol sync
        id: mechanical
        working-directory: codexsdk
        env:
          GOTOOLCHAIN: local
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade || false }}
          FORCE_COMPARE: ${{ inputs.force_compare || false }}
          REQUESTED_REF: ${{ inputs.upstream_ref || '' }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_BOT_ID: ${{ vars.PROTOCOL_SYNC_APP_BOT_ID }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          args=(
            sync
            -repo-root "${GITHUB_WORKSPACE}"
            -module-root .
            -upstream-repo https://github.com/openai/codex.git
            -event-name "${EVENT_NAME}"
            -github-repository "${GITHUB_REPOSITORY}"
            -app-bot-id "${APP_BOT_ID}"
            -base-branch "${DEFAULT_BRANCH}"
          )
          if [[ -n "${REQUESTED_REF}" ]]; then
            args+=(-upstream-ref "${REQUESTED_REF}")
          fi
          if [[ "${ALLOW_DOWNGRADE}" == "true" ]]; then
            args+=(-allow-downgrade)
          fi
          if [[ "${FORCE_COMPARE}" == "true" ]]; then
            args+=(-force-compare)
          fi
          go run ./internal/cmd/protocolupgrade "${args[@]}"

      - name: Write Agent drift input
        if: ${{ success() && steps.mechanical.outputs.outcome == 'semantic_unresolved' }}
        working-directory: codexsdk
        env:
          TARGET_REF: ${{ steps.mechanical.outputs.target_ref }}
          TARGET_KIND: ${{ steps.mechanical.outputs.target_kind }}
          TARGET_SHA: ${{ steps.mechanical.outputs.target_sha }}
          CANDIDATE: ${{ steps.mechanical.outputs.candidate }}
          CANDIDATE_DIR: ${{ steps.mechanical.outputs.candidate_dir }}
          CANDIDATE_SHA256: ${{ steps.mechanical.outputs.candidate_sha256 }}
          ISSUE_STAGE: ${{ steps.mechanical.outputs.issue_stage }}
          ISSUE_PATH: ${{ steps.mechanical.outputs.issue_path }}
          ISSUE_REASON: ${{ steps.mechanical.outputs.issue_reason }}
        run: |
          set -euo pipefail
          mkdir -p .cache/codexsdk-sync
          {
            echo "Selected upstream target:"
            echo "- ref: ${TARGET_REF}"
            echo "- kind: ${TARGET_KIND}"
            echo "- commit: ${TARGET_SHA}"
            echo
            echo "Candidate root: ${CANDIDATE_DIR}"
            echo "Candidate sha256: ${CANDIDATE_SHA256}"
            echo "Candidate schema: ${CANDIDATE}"
            echo "Drift summary: ${CANDIDATE_DIR}/reports/drift_summary.json"
            echo
            echo "Read-only planning found an unresolved deterministic incompatibility."
            echo "- stage: ${ISSUE_STAGE}"
            echo "- path: ${ISSUE_PATH}"
            echo "- reason: ${ISSUE_REASON}"
            echo
            echo "No mechanical protocol/generated changes have been applied."
            echo "Make only the handwritten source and focused test changes required to make this exact candidate plan successfully."
          } > .cache/codexsdk-sync/agent-input.md

      - name: Apply one Agent pass for unresolved semantic drift
        id: codex
        if: ${{ success() && steps.mechanical.outputs.outcome == 'semantic_unresolved' }}
        uses: ./.github/actions/codex-exec
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        with:
          api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.CODEX_RESPONSES_API_ENDPOINT }}
          model: gpt-6-sol
          reasoning-effort: xhigh
          working-directory: .
          prompt: >-
            Read .agents/skills/codexsdk-sync-upstream/SKILL.md.
            Read codexsdk/.cache/codexsdk-sync/agent-input.md.
            The selected upstream target has been generated and compared, but
            read-only planning found a concrete unresolved incompatibility. No
            mechanical protocol/generated changes have been applied. Make only
            the targeted handwritten generator/semantic source and focused test
            changes required for that exact candidate to plan successfully. Do
            not resolve a different target or hand-edit generated outputs. Do not
            stage, commit, push, create or update a pull request, or treat a
            final model message as proof that the implementation is correct.
            Leave changes unstaged.

      - name: Check Agent proposal scope
        id: proposal_scope
        if: ${{ success() && steps.mechanical.outputs.outcome == 'semantic_unresolved' }}
        env:
          CONTROL_SHA256: ${{ steps.control.outputs.sha256 }}
        run: &agent_proposal_scope |
          set -euo pipefail
          control="${RUNNER_TEMP}/protocolupgrade-control"
          echo "${CONTROL_SHA256}  ${control}" | sha256sum -c -
          "${control}" scope -repo-root "${GITHUB_WORKSPACE}" -phase "${SCOPE_PHASE:-agent}"

      - name: Re-plan and apply candidate
        id: resume
        if: ${{ success() && steps.mechanical.outputs.outcome == 'semantic_unresolved' }}
        working-directory: codexsdk
        env:
          GOTOOLCHAIN: local
          CANDIDATE_DIR: ${{ steps.mechanical.outputs.candidate_dir }}
          CANDIDATE_SHA256: ${{ steps.mechanical.outputs.candidate_sha256 }}
          TARGET_REF: ${{ steps.mechanical.outputs.target_ref }}
          TARGET_KIND: ${{ steps.mechanical.outputs.target_kind }}
          TARGET_SHA: ${{ steps.mechanical.outputs.target_sha }}
        run: |
          set -euo pipefail
          go run ./internal/cmd/protocolupgrade resume \
            -repo-root "${GITHUB_WORKSPACE}" \
            -module-root . \
            -candidate-dir "${CANDIDATE_DIR}" \
            -candidate-sha256 "${CANDIDATE_SHA256}" \
            -target-ref "${TARGET_REF}" \
            -target-kind "${TARGET_KIND}" \
            -target-sha "${TARGET_SHA}"

      - name: Freeze proposal bytes before tests
        id: freeze
        if: ${{ steps.mechanical.outputs.outcome == 'applied' || steps.resume.outputs.outcome == 'applied' }}
        run: |
          set -euo pipefail
          git ls-files --others --exclude-standard -z |
            git add -N --pathspec-from-file=- --pathspec-file-nul
          digest="$(git diff --binary --no-ext-diff HEAD -- | sha256sum | cut -d ' ' -f1)"
          echo "patch_sha256=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Run deterministic protocol checks
        id: checks
        if: ${{ steps.mechanical.outputs.outcome == 'applied' || steps.resume.outputs.outcome == 'applied' }}
        working-directory: codexsdk
        env:
          GOTOOLCHAIN: local
          CANDIDATE: ${{ steps.mechanical.outputs.candidate }}
        run: |
          set -euo pipefail
          go test ./...
          args=(check -module-root .)
          if [[ -n "${CANDIDATE}" ]]; then
            args+=(-candidate "${CANDIDATE}")
          fi
          go run ./internal/cmd/protocolupgrade "${args[@]}"
          git -C "${GITHUB_WORKSPACE}" diff --check
          unformatted="$(
            git -C "${GITHUB_WORKSPACE}" ls-files -z -- 'codexsdk/*.go' 'codexsdk/**/*.go' |
              xargs -0 -r -I{} gofmt -l "${GITHUB_WORKSPACE}/{}"
          )"
          if [[ -n "${unformatted}" ]]; then
            echo "gofmt required:" >&2
            printf '%s\n' "${unformatted}" >&2
            exit 1
          fi
          go vet ./...

      - name: Recheck Agent proposal scope after tests
        id: final_scope
        if: ${{ success() && steps.mechanical.outputs.outcome == 'semantic_unresolved' }}
        env:
          CONTROL_SHA256: ${{ steps.control.outputs.sha256 }}
          SCOPE_PHASE: final
        run: *agent_proposal_scope

      - name: Seal verified proposal
        id: handoff
        if: ${{ success() && (steps.mechanical.outputs.outcome == 'applied' || steps.resume.outputs.outcome == 'applied') }}
        working-directory: codexsdk
        env:
          CANDIDATE_DIR: ${{ steps.mechanical.outputs.candidate_dir }}
          CANDIDATE_SHA256: ${{ steps.mechanical.outputs.candidate_sha256 }}
          TARGET_KIND: ${{ steps.mechanical.outputs.target_kind }}
          TARGET_REF: ${{ steps.mechanical.outputs.target_ref }}
          TARGET_SHA: ${{ steps.mechanical.outputs.target_sha }}
          CONTROL_SHA256: ${{ steps.control.outputs.sha256 }}
          PROPOSAL_SHA256: ${{ steps.freeze.outputs.patch_sha256 }}
        run: |
          set -euo pipefail
          git -C "${GITHUB_WORKSPACE}" ls-files --others --exclude-standard -z |
            git -C "${GITHUB_WORKSPACE}" add -N --pathspec-from-file=- --pathspec-file-nul
          git -C "${GITHUB_WORKSPACE}" diff --binary --no-ext-diff HEAD -- > "${RUNNER_TEMP}/protocol-sync.final.patch"
          echo "${PROPOSAL_SHA256}  ${RUNNER_TEMP}/protocol-sync.final.patch" | sha256sum -c -
          test -s "${RUNNER_TEMP}/protocol-sync.final.patch"
          control="${RUNNER_TEMP}/protocolupgrade-control"
          echo "${CONTROL_SHA256}  ${control}" | sha256sum -c -
          if [[ -n "${CANDIDATE_SHA256}" ]]; then
            "${control}" verify-candidate \
              -candidate-dir "${CANDIDATE_DIR}" \
              -candidate-sha256 "${CANDIDATE_SHA256}" \
              -target-ref "${TARGET_REF}" \
              -target-kind "${TARGET_KIND}" \
              -target-sha "${TARGET_SHA}"
          fi
          mkdir -p "${RUNNER_TEMP}/protocol-sync-handoff"
          cp "${RUNNER_TEMP}/protocol-sync.final.patch" "${RUNNER_TEMP}/protocol-sync-handoff/proposal.patch"
          digest="$(sha256sum "${RUNNER_TEMP}/protocol-sync-handoff/proposal.patch" | cut -d ' ' -f1)"
          echo "patch_sha256=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Upload verified proposal
        if: ${{ success() && steps.handoff.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-sync-proposal
          path: ${{ runner.temp }}/protocol-sync-handoff/proposal.patch
          if-no-files-found: error

      - name: Retain selected build inputs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-sync-build-inputs-sync
          path: |
            codexsdk/.cache/codexsdk-upstream-*/upstream.Cargo.lock
            codexsdk/.cache/codexsdk-upstream-*/prepared.Cargo.lock
          include-hidden-files: true
          if-no-files-found: ignore

  publish:
    if: ${{ needs.sync.outputs.outcome == 'applied' || needs.sync.outputs.resume_outcome == 'applied' }}
    needs: sync
    outputs:
      outcome: ${{ steps.publish.outputs.outcome }}
      category: ${{ steps.publish.outputs.failure_category || steps.app_config.outputs.failure_category }}
      pr_url: ${{ steps.publish.outputs.pr_url }}
    name: Publish protected sync PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check publication App configuration
        id: app_config
        env:
          APP_CONFIGURED: ${{ vars.PROTOCOL_SYNC_APP_CLIENT_ID != '' && vars.PROTOCOL_SYNC_APP_BOT_ID != '' && secrets.PROTOCOL_SYNC_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "${APP_CONFIGURED}" != true ]]; then
            echo '::error::Configure PROTOCOL_SYNC_APP_CLIENT_ID, PROTOCOL_SYNC_APP_BOT_ID and PROTOCOL_SYNC_APP_PRIVATE_KEY for an App installed on this repository with Contents and Pull requests write access. See docs/protocol-sync.md.' >&2
            echo 'failure_category=policy_configuration' >> "${GITHUB_OUTPUT}"
            exit 1
          fi

      - name: Check out trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build trusted publication control
        working-directory: codexsdk
        env:
          GOTOOLCHAIN: local
        run: go build -o "${RUNNER_TEMP}/protocolupgrade-control" ./internal/cmd/protocolupgrade

      - name: Download verified proposal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: protocol-sync-proposal
          path: ${{ runner.temp }}/protocol-sync-handoff

      - name: Mint repository publication token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PROTOCOL_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish verified proposal
        id: publish
        working-directory: codexsdk
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PATCH_SHA256: ${{ needs.sync.outputs.patch_sha256 }}
          APP_BOT_ID: ${{ vars.PROTOCOL_SYNC_APP_BOT_ID }}
          EXPECTED_HEAD: ${{ needs.sync.outputs.publication_head }}
          EXPECTED_BRANCH: ${{ needs.sync.outputs.publication_branch }}
          TARGET_KIND: ${{ needs.sync.outputs.target_kind }}
          TARGET_REF: ${{ needs.sync.outputs.target_ref }}
          TARGET_SHA: ${{ needs.sync.outputs.target_sha }}
        run: |
          set -euo pipefail
          patch="${RUNNER_TEMP}/protocol-sync-handoff/proposal.patch"
          echo "${PATCH_SHA256}  ${patch}" | sha256sum -c -
          git -C "${GITHUB_WORKSPACE}" apply --check "${patch}"
          git -C "${GITHUB_WORKSPACE}" apply "${patch}"
          control="${RUNNER_TEMP}/protocolupgrade-control"
          "${control}" stage \
            -repo-root "${GITHUB_WORKSPACE}" \
            -phase final
          git diff --cached --check
          git -c user.name="codexsdk-sync-bot" \
            -c user.email="codexsdk-sync-bot@users.noreply.github.com" \
            commit \
            -m "Sync Codex protocol baseline to ${TARGET_REF}" \
            -m "Upstream-ref: ${TARGET_REF}" \
            -m "Upstream-ref-kind: ${TARGET_KIND}" \
            -m "Upstream-commit: ${TARGET_SHA}"
          gh auth status
          gh auth setup-git
          "${control}" publish \
            -repo-root "${GITHUB_WORKSPACE}" \
            -base-branch "${DEFAULT_BRANCH}" \
            -github-repository "${GITHUB_REPOSITORY}" \
            -app-bot-id "${APP_BOT_ID}" \
            -expected-head "${EXPECTED_HEAD}" \
            -expected-branch "${EXPECTED_BRANCH}" \
            -target-ref "${TARGET_REF}" \
            -target-kind "${TARGET_KIND}" \
            -target-sha "${TARGET_SHA}"

  summary:
    if: ${{ always() }}
    needs: [diagnose, sync, publish]
    name: Report observed sync result
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Summarize observed result
        id: observed_summary
        env:
          DIAGNOSE_RESULT: ${{ needs.diagnose.result }}
          SYNC_RESULT: ${{ needs.sync.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          OUTCOME: ${{ needs.publish.outputs.outcome || needs.sync.outputs.resume_outcome || needs.sync.outputs.outcome || needs.diagnose.outputs.outcome }}
          STAGE: ${{ needs.sync.outputs.stage || needs.diagnose.outputs.stage }}
          CATEGORY: ${{ needs.publish.outputs.category || needs.sync.outputs.category || needs.diagnose.outputs.category }}
          TARGET_REF: ${{ needs.sync.outputs.target_ref || needs.diagnose.outputs.target_ref }}
          TARGET_SHA: ${{ needs.sync.outputs.target_sha || needs.diagnose.outputs.target_sha }}
          CHECKS: ${{ needs.sync.outputs.checks || needs.diagnose.outputs.checks }}
          AGENT: ${{ needs.sync.outputs.agent }}
          SCOPE: ${{ needs.sync.outputs.scope }}
          HANDOFF: ${{ needs.sync.outputs.handoff }}
          PR_URL: ${{ needs.publish.outputs.pr_url || needs.sync.outputs.pr_url }}
          PUBLICATION_CHECKS: ${{ needs.sync.outputs.publication_checks }}
        run: |
          set -euo pipefail
          next='Inspect the failing job logs; attribution is unknown until evidence identifies the cause.'
          result="${OUTCOME:-unavailable}"
          if [[ "${DIAGNOSE_RESULT}" == failure || "${SYNC_RESULT}" == failure || "${PUBLISH_RESULT}" == failure || "${DIAGNOSE_RESULT}" == cancelled || "${SYNC_RESULT}" == cancelled || "${PUBLISH_RESULT}" == cancelled ]]; then
            result=failed
            if [[ "${PUBLISH_RESULT}" == failure || "${PUBLISH_RESULT}" == cancelled ]]; then
              STAGE=publication
            elif [[ "${CHECKS}" == failure ]]; then
              STAGE=repository_checks
              CATEGORY=repository_validation
            elif [[ "${AGENT}" == failure ]]; then
              STAGE=agent
              CATEGORY=unknown
            elif [[ "${SCOPE}" == failure ]]; then
              STAGE=proposal_scope
              CATEGORY=policy_configuration
              next='needs-maintainer: review the rejected proposal paths before attempting another repair.'
            elif [[ "${HANDOFF}" == failure ]]; then
              STAGE=handoff
              CATEGORY=source_integrity
            fi
          else
            case "${result}" in
              baseline_matches) next='Accepted baseline already points to this target; no fresh upstream proof was acquired.' ;;
              schemas_match) next='Schemas match only; provenance has not been advanced and no PR was published.' ;;
              exact_verified) next='Fresh reconstruction verified this repository head; required PR checks remain separate.' ;;
              plan_ready) next='Candidate can be generated; run the trusted sync workflow to apply and validate it.' ;;
              semantic_unresolved) next='Review the reported unsupported representation; only the trusted sync workflow may attempt one constrained repair.' ;;
              pr_pending) next='PR is pending required checks and repository review/integration; publication is not integration.' ;;
              applied) next='Candidate was applied locally; inspect publication status before claiming delivery.' ;;
            esac
          fi
          {
            echo '## Observed protocol sync result'
            echo "- Result: ${result}"
            echo "- Jobs: diagnosis=${DIAGNOSE_RESULT}; sync=${SYNC_RESULT}; publication=${PUBLISH_RESULT}"
            echo "- Stage: ${STAGE:-setup_or_unavailable}"
            echo "- Failure category: ${CATEGORY:-unknown}"
            echo "- Repository commit: ${GITHUB_SHA}"
            echo "- Upstream: ${TARGET_REF:-unavailable} / ${TARGET_SHA:-unavailable}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "- PR: ${PR_URL:-not_published}"
            echo "- Observed pending checks: ${PUBLICATION_CHECKS:-not_observed}"
            echo "- Next: ${next}"
            echo '- This summary reports observations and never certifies or integrates a candidate.'
          } >> "${GITHUB_STEP_SUMMARY}"

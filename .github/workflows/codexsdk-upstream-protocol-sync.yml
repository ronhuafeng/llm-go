name: Codex Upstream Protocol Sync
run-name: "Protocol sync ${{ inputs.upstream_ref || 'latest stable' }}"

on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Optional openai/codex tag, ref, or full SHA. Defaults to the latest stable rust-vX.Y.Z tag."
        required: false
        type: string
      allow_downgrade:
        description: "Allow an explicit stable rust-vX.Y.Z target older than the current stable-tag baseline."
        required: false
        type: boolean
        default: false
      force_compare:
        description: "Generate drift artifacts even when baseline metadata already points at the selected upstream target."
        required: false
        type: boolean
        default: false
      validation_only:
        description: "Run Codex and local validation from the current open PR without committing or publishing protocol changes."
        required: false
        type: boolean
        default: false

concurrency:
  group: codex-upstream-protocol-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Run Codex upstream sync
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Guard control-plane ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_ONLY: ${{ inputs.validation_only || false }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            exit 0
          fi
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" || "${VALIDATION_ONLY}" != "true" ]]; then
            echo "Refusing to run protocol sync from ${GITHUB_REF_NAME}; use ${DEFAULT_BRANCH} or validation_only from an open PR." >&2
            exit 1
          fi

          matching_prs="$(
            gh pr list \
              --repo "${GH_REPO}" \
              --state open \
              --base "${DEFAULT_BRANCH}" \
              --head "${GITHUB_REF_NAME}" \
              --json headRefOid,headRepository \
              --jq '[.[] | select(.headRefOid == env.GITHUB_SHA and .headRepository.nameWithOwner == env.GH_REPO)] | length'
          )"
          if [[ "${matching_prs}" != "1" ]]; then
            echo "validation_only requires exactly one open same-repository PR from ${GITHUB_REF_NAME} at ${GITHUB_SHA}." >&2
            exit 1
          fi

      - name: Check out trusted control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: codexsdk/go.mod
          cache: false

      - name: Provision Codex schema build dependencies
        run: |
          set -euo pipefail
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - name: Guard clean protocol worktree
        working-directory: codexsdk
        run: |
          python3 scripts/codexsdk_sync_changes.py assert-clean \
            --repo-root "${GITHUB_WORKSPACE}"

      - name: Resolve upstream target
        id: target
        working-directory: codexsdk
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade || false }}
          FORCE_COMPARE: ${{ inputs.force_compare || false }}
          REQUESTED_REF: ${{ inputs.upstream_ref || '' }}
          UPSTREAM_REPO: https://github.com/openai/codex.git
        run: |
          set -euo pipefail
          args=(--remote "${UPSTREAM_REPO}" --json)
          if [[ -n "${REQUESTED_REF}" ]]; then
            args+=(--upstream-ref "${REQUESTED_REF}")
          else
            args+=(--latest-stable)
          fi
          python3 scripts/codexsdk_resolve_upstream.py "${args[@]}" > /tmp/codexsdk-target.json
          {
            echo "ref=$(jq -r '.ref_name' /tmp/codexsdk-target.json)"
            echo "kind=$(jq -r '.ref_kind' /tmp/codexsdk-target.json)"
            echo "sha=$(jq -r '.peeled_commit_sha' /tmp/codexsdk-target.json)"
            echo "explicit=$(jq -r '.target_explicit' /tmp/codexsdk-target.json)"
          } >> "${GITHUB_OUTPUT}"

          mkdir -p .cache/codexsdk-sync
          jq \
            --arg allow_downgrade "${ALLOW_DOWNGRADE}" \
            --arg force_compare "${FORCE_COMPARE}" \
            --arg upstream_repo "${UPSTREAM_REPO}" \
            '{
              target_ref: .ref_name,
              target_kind: .ref_kind,
              target_sha: .peeled_commit_sha,
              target_explicit: .target_explicit,
              allow_downgrade: ($allow_downgrade == "true"),
              force_compare: ($force_compare == "true"),
              upstream_repo: $upstream_repo
            }' /tmp/codexsdk-target.json > .cache/codexsdk-sync/action-inputs.json

      - name: Implement target protocol with Codex
        id: codex
        uses: ./.github/actions/codex-exec
        with:
          api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.CODEX_RESPONSES_API_ENDPOINT }}
          working-directory: codexsdk
          prompt: 'Use $codexsdk-sync-upstream.'

      - name: Require completed Codex implementation
        id: completion
        working-directory: codexsdk
        env:
          CODEX_FINAL_MESSAGE_PATH: ${{ steps.codex.outputs.final-message-path }}
        run: |
          set -euo pipefail
          if [[ ! -s "${CODEX_FINAL_MESSAGE_PATH}" ]]; then
            echo "Codex did not write a final message." >&2
            exit 1
          fi
          CODEX_FINAL_MESSAGE="$(< "${CODEX_FINAL_MESSAGE_PATH}")"
          first_line="${CODEX_FINAL_MESSAGE%%$'\n'*}"
          case "${first_line}" in
            "protocol implementation complete") mode="implemented" ;;
            "protocol implementation current") mode="current" ;;
            "protocol comparison clean") mode="comparison" ;;
            *)
              echo "Codex stopped before reaching a successful protocol state." >&2
              printf '%s\n' "${CODEX_FINAL_MESSAGE}" >&2
              exit 1
              ;;
          esac
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Inspect protocol implementation
        id: implementation
        working-directory: codexsdk
        env:
          COMPLETION_MODE: ${{ steps.completion.outputs.mode }}
          FORCE_COMPARE: ${{ inputs.force_compare || false }}
          RESOLVED_TARGET_KIND: ${{ steps.target.outputs.kind }}
          RESOLVED_TARGET_REF: ${{ steps.target.outputs.ref }}
          RESOLVED_TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          changed = subprocess.run(
              ["git", "-C", str(workspace), "status", "--porcelain", "--untracked-files=all"],
              check=True,
              stdout=subprocess.PIPE,
              text=True,
          ).stdout.strip()
          completion_mode = os.environ["COMPLETION_MODE"]
          force_compare = os.environ["FORCE_COMPARE"].lower() == "true"
          if force_compare:
              if completion_mode != "comparison":
                  raise SystemExit(
                      f"force_compare requires completion mode 'comparison', got {completion_mode!r}"
                  )
              if changed:
                  raise SystemExit("force_compare must leave the protocol worktree unchanged")
          elif changed:
              if completion_mode != "implemented":
                  raise SystemExit(
                      f"changed protocol implementation requires completion mode 'implemented', "
                      f"got {completion_mode!r}"
                  )
          elif completion_mode != "current":
              raise SystemExit(
                  f"unchanged protocol implementation requires completion mode 'current', "
                  f"got {completion_mode!r}"
              )

          values = {"publish": "false"}
          if changed:
              metadata = json.loads(
                  Path("internal/protocolschema/appserver/v2/baseline_metadata.json").read_text(encoding="utf-8")
              )
              values = {
                  "publish": "true",
                  "target_ref": str(metadata.get("source_ref_name") or ""),
                  "target_kind": str(metadata.get("source_ref_kind") or ""),
                  "target_sha": str(metadata.get("source_commit") or ""),
              }
              if not all(values[key] for key in ("target_ref", "target_kind", "target_sha")):
                  raise SystemExit("completed protocol implementation lacks canonical target provenance")
              expected = {
                  "target_ref": os.environ["RESOLVED_TARGET_REF"],
                  "target_kind": os.environ["RESOLVED_TARGET_KIND"],
                  "target_sha": os.environ["RESOLVED_TARGET_SHA"],
              }
              for key, value in expected.items():
                  if values[key] != value:
                      raise SystemExit(f"protocol implementation {key}={values[key]!r}, expected {value!r}")
          elif not force_compare:
              metadata = json.loads(
                  Path("internal/protocolschema/appserver/v2/baseline_metadata.json").read_text(encoding="utf-8")
              )
              if metadata.get("source_commit") != os.environ["RESOLVED_TARGET_SHA"]:
                  raise SystemExit("Codex produced no changes before reaching the resolved target")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY

      - name: Validate protocol implementation
        id: validation
        if: steps.implementation.outputs.publish == 'true'
        working-directory: codexsdk
        env:
          TARGET_SHA: ${{ steps.implementation.outputs.target_sha }}
        run: |
          scripts/codexsdk_validate_sync.sh --target-sha "${TARGET_SHA}"

      - name: Capture final protocol changes
        if: steps.implementation.outputs.publish == 'true'
        working-directory: codexsdk
        run: |
          python3 scripts/codexsdk_sync_changes.py capture \
            --repo-root "${GITHUB_WORKSPACE}" \
            --phase final \
            --output /tmp/codexsdk-final-changes.json

      - name: Commit validated protocol implementation
        id: commit
        if: steps.implementation.outputs.publish == 'true' && inputs.validation_only != true
        working-directory: codexsdk
        env:
          TARGET_KIND: ${{ steps.implementation.outputs.target_kind }}
          TARGET_REF: ${{ steps.implementation.outputs.target_ref }}
          TARGET_SHA: ${{ steps.implementation.outputs.target_sha }}
        run: |
          set -euo pipefail
          python3 scripts/codexsdk_sync_changes.py stage \
            --repo-root "${GITHUB_WORKSPACE}" \
            --manifest /tmp/codexsdk-final-changes.json
          git diff --cached --check
          git -c user.name="codexsdk-sync-bot" \
            -c user.email="codexsdk-sync-bot@users.noreply.github.com" \
            commit \
            -m "Sync Codex protocol baseline to ${TARGET_REF}" \
            -m "Upstream-ref: ${TARGET_REF}" \
            -m "Upstream-ref-kind: ${TARGET_KIND}" \
            -m "Upstream-commit: ${TARGET_SHA}"
          echo "validated_commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Publish protected sync PR
        id: publish
        if: steps.implementation.outputs.publish == 'true' && inputs.validation_only != true
        working-directory: codexsdk
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_KIND: ${{ steps.implementation.outputs.target_kind }}
          TARGET_REF: ${{ steps.implementation.outputs.target_ref }}
          TARGET_SHA: ${{ steps.implementation.outputs.target_sha }}
          VALIDATED_COMMIT: ${{ steps.commit.outputs.validated_commit }}
        run: |
          set -euo pipefail
          gh auth status
          gh auth setup-git
          scripts/codexsdk_publish_sync_pr.sh \
            --land-ref "${DEFAULT_BRANCH}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --branch-prefix "codex/sync-upstream/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target-ref "${TARGET_REF}" \
            --target-kind "${TARGET_KIND}" \
            --target-sha "${TARGET_SHA}" \
            --sync-mode repair-sync \
            --validated-commit "${VALIDATED_COMMIT}"

      - name: Report protocol sync outcome
        if: >-
          always() &&
          steps.completion.outcome == 'success' &&
          steps.implementation.outcome == 'success' &&
          (steps.implementation.outputs.publish != 'true' || steps.validation.outcome == 'success') &&
          (inputs.validation_only == true ||
           steps.implementation.outputs.publish != 'true' ||
           (steps.commit.outcome == 'success' && steps.publish.outcome == 'success'))
        env:
          COMPLETION_MODE: ${{ steps.completion.outputs.mode }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          PUBLISH: ${{ steps.implementation.outputs.publish }}
          TARGET_REF: ${{ steps.target.outputs.ref }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          VALIDATION_ONLY: ${{ inputs.validation_only || false }}
        run: |
          {
            echo
            echo "## Protocol sync outcome"
            echo
            if [[ "${PUBLISH}" == "true" ]]; then
              echo "- Codex completion: \`protocol implementation complete\`"
              echo "- Upstream target: \`${TARGET_REF}\`"
              echo "- Upstream commit: \`${TARGET_SHA}\`"
              if [[ "${VALIDATION_ONLY}" == "true" ]]; then
                echo "- PR validation: protocol implementation validated; commit and publication intentionally skipped."
              else
                echo "- Workflow publication: ${PR_URL}"
              fi
            elif [[ "${COMPLETION_MODE}" == "comparison" ]]; then
              echo "- Codex completion: \`protocol comparison clean\`"
              echo "- Upstream target: \`${TARGET_REF}\`"
              echo "- Upstream commit: \`${TARGET_SHA}\`"
              echo "- Read-only comparison found no protocol drift."
            else
              echo "- Codex completion: \`protocol implementation current\`"
              echo "- Upstream target: \`${TARGET_REF}\`"
              echo "- Upstream commit: \`${TARGET_SHA}\`"
              echo "- Checked-in protocol implementation is already current."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

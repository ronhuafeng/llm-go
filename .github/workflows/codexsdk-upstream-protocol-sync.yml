name: Codex Upstream Protocol Sync
run-name: "Protocol sync ${{ inputs.upstream_ref || 'latest stable' }}"

on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Optional openai/codex tag, ref, or full SHA. Defaults to the latest stable rust-vX.Y.Z tag."
        required: false
        type: string
      allow_downgrade:
        description: "Allow an explicit stable rust-vX.Y.Z target older than the current stable-tag baseline."
        required: false
        type: boolean
        default: false
      force_compare:
        description: "Generate drift artifacts even when baseline metadata already points at the selected upstream target."
        required: false
        type: boolean
        default: false
      validation_only:
        description: "Run mechanical sync and local validation from the current open PR without committing or publishing protocol changes."
        required: false
        type: boolean
        default: false

concurrency:
  group: codex-upstream-protocol-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream protocol
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Guard control-plane ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_ONLY: ${{ inputs.validation_only || false }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            exit 0
          fi
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" || "${VALIDATION_ONLY}" != "true" ]]; then
            echo "Refusing to run protocol sync from ${GITHUB_REF_NAME}; use ${DEFAULT_BRANCH} or validation_only from an open PR." >&2
            exit 1
          fi

          matching_prs="$(
            gh pr list \
              --repo "${GH_REPO}" \
              --state open \
              --base "${DEFAULT_BRANCH}" \
              --head "${GITHUB_REF_NAME}" \
              --json headRefOid,headRepository \
              --jq '[.[] | select(.headRefOid == env.GITHUB_SHA and .headRepository.nameWithOwner == env.GH_REPO)] | length'
          )"
          if [[ "${matching_prs}" != "1" ]]; then
            echo "validation_only requires exactly one open same-repository PR from ${GITHUB_REF_NAME} at ${GITHUB_SHA}." >&2
            exit 1
          fi

      - name: Check out trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: codexsdk/go.mod
          cache: false

      - name: Provision Codex schema build dependencies
        run: |
          set -euo pipefail
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - name: Guard clean protocol worktree
        working-directory: codexsdk
        run: |
          python3 scripts/codexsdk_sync_changes.py assert-clean \
            --repo-root "${GITHUB_WORKSPACE}"

      - name: Resolve upstream target
        id: target
        working-directory: codexsdk
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade || false }}
          FORCE_COMPARE: ${{ inputs.force_compare || false }}
          REQUESTED_REF: ${{ inputs.upstream_ref || '' }}
          UPSTREAM_REPO: https://github.com/openai/codex.git
        run: |
          set -euo pipefail
          args=(--remote "${UPSTREAM_REPO}" --json)
          if [[ -n "${REQUESTED_REF}" ]]; then
            args+=(--upstream-ref "${REQUESTED_REF}")
          else
            args+=(--latest-stable)
          fi
          python3 scripts/codexsdk_resolve_upstream.py "${args[@]}" > /tmp/codexsdk-target.json
          {
            echo "ref=$(jq -r '.ref_name' /tmp/codexsdk-target.json)"
            echo "kind=$(jq -r '.ref_kind' /tmp/codexsdk-target.json)"
            echo "sha=$(jq -r '.peeled_commit_sha' /tmp/codexsdk-target.json)"
            echo "explicit=$(jq -r '.target_explicit' /tmp/codexsdk-target.json)"
          } >> "${GITHUB_OUTPUT}"

          mkdir -p .cache/codexsdk-sync
          jq \
            --arg allow_downgrade "${ALLOW_DOWNGRADE}" \
            --arg force_compare "${FORCE_COMPARE}" \
            --arg upstream_repo "${UPSTREAM_REPO}" \
            '{
              target_ref: .ref_name,
              target_kind: .ref_kind,
              target_sha: .peeled_commit_sha,
              target_explicit: .target_explicit,
              allow_downgrade: ($allow_downgrade == "true"),
              force_compare: ($force_compare == "true"),
              upstream_repo: $upstream_repo
            }' /tmp/codexsdk-target.json > .cache/codexsdk-sync/action-inputs.json

      - name: Run mechanical protocol sync
        id: mechanical
        working-directory: codexsdk
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 scripts/codexsdk_mechanical_sync.py --repo-root "${GITHUB_WORKSPACE}"

      - name: Prove checked-in generated artifacts
        id: generated-proof
        if: steps.mechanical.outcome == 'success' && steps.mechanical.outputs.escalate != 'true'
        working-directory: codexsdk
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
          TARGET_SHA: ${{ steps.mechanical.outputs.target_sha }}
          TARGET_REF: ${{ steps.mechanical.outputs.target_ref }}
          REPOSITORY_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/proof"
          go run ./internal/cmd/generatedproof \
            -expected-upstream-commit "${TARGET_SHA}" \
            -expected-upstream-ref "${TARGET_REF}" \
            -expected-repository-commit "${REPOSITORY_COMMIT}" \
            -json-out "${RUNNER_TEMP}/proof/generated.json"

      - name: Owner-local codexsdk tests
        id: owner-local-tests
        if: steps.mechanical.outcome == 'success' && steps.mechanical.outputs.escalate != 'true'
        working-directory: codexsdk
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: go test ./...

      - name: Candidate schema state
        id: schema-state
        if: steps.mechanical.outputs.applied == 'true'
        working-directory: codexsdk
        env:
          CANDIDATE: ${{ steps.mechanical.outputs.candidate }}
          TARGET_SHA: ${{ steps.mechanical.outputs.target_sha }}
        run: |
          set -euo pipefail
          python3 scripts/codexsdk_sync_state.py \
            --baseline internal/protocolschema/appserver/v2 \
            --candidate "${CANDIDATE}" \
            --target-sha "${TARGET_SHA}"

      - name: Remaining script tests
        id: script-tests
        if: steps.mechanical.outputs.applied == 'true'
        working-directory: codexsdk
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p '*_test.py'

      - name: Record workflow proof failure
        if: >-
          steps.mechanical.outputs.applied == 'true' &&
          (steps.generated-proof.outcome == 'failure' ||
           steps.owner-local-tests.outcome == 'failure' ||
           steps.schema-state.outcome == 'failure' ||
           steps.script-tests.outcome == 'failure')
        working-directory: codexsdk
        env:
          TARGET_REF: ${{ steps.mechanical.outputs.target_ref }}
          TARGET_KIND: ${{ steps.mechanical.outputs.target_kind }}
          TARGET_SHA: ${{ steps.mechanical.outputs.target_sha }}
          CANDIDATE: ${{ steps.mechanical.outputs.candidate }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(".cache/codexsdk-sync/escalation.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(
                  {
                      "target_ref": os.environ["TARGET_REF"],
                      "target_kind": os.environ["TARGET_KIND"],
                      "target_sha": os.environ["TARGET_SHA"],
                      "reason": "workflow owner-local proofs failed after mechanical apply",
                      "detail": "generatedproof, owner-local tests, schema-state, or remaining script tests failed",
                      "artifacts": {"candidate": os.environ.get("CANDIDATE", "")},
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Escalate unsupported semantic drift
        id: codex
        if: >-
          steps.mechanical.outputs.escalate == 'true' ||
          (steps.mechanical.outputs.applied == 'true' &&
           (steps.generated-proof.outcome == 'failure' ||
            steps.owner-local-tests.outcome == 'failure' ||
            steps.schema-state.outcome == 'failure' ||
            steps.script-tests.outcome == 'failure'))
        uses: ./.github/actions/codex-exec
        with:
          api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.CODEX_RESPONSES_API_ENDPOINT }}
          working-directory: codexsdk
          prompt: >-
            The mechanical protocol sync escalated. Read
            ${{ github.workspace }}/codexsdk/.cache/codexsdk-sync/escalation.json
            and use $codexsdk-sync-upstream only to repair the recorded
            unsupported semantic drift for that upstream ref and commit. Do not
            resolve a different target or rediscover the repository. Leave
            changes unstaged.

      - name: Reject mismatched Codex escalation claim
        if: always() && (steps.codex.outcome == 'success' || steps.codex.outcome == 'failure')
        env:
          CODEX_FINAL_MESSAGE_PATH: ${{ steps.codex.outputs.final-message-path }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = os.environ.get("CODEX_FINAL_MESSAGE_PATH", "")
          if not path or not Path(path).is_file() or Path(path).stat().st_size == 0:
              raise SystemExit("escalation Codex did not write a final message")
          first_line = Path(path).read_text(encoding="utf-8").splitlines()[0]
          if first_line in {"protocol implementation current", "protocol comparison clean"}:
              raise SystemExit(
                  f"escalation Codex claim {first_line!r} does not match repair worktree mode"
              )
          PY

      - name: Validate escalated protocol implementation
        id: escalation-validation
        if: steps.codex.outcome == 'success'
        working-directory: codexsdk
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
          TARGET_SHA: ${{ steps.mechanical.outputs.target_sha }}
          TARGET_REF: ${{ steps.mechanical.outputs.target_ref }}
          REPOSITORY_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/proof"
          go run ./internal/cmd/generatedproof \
            -expected-upstream-commit "${TARGET_SHA}" \
            -expected-upstream-ref "${TARGET_REF}" \
            -expected-repository-commit "${REPOSITORY_COMMIT}" \
            -json-out "${RUNNER_TEMP}/proof/generated.json"
          go test ./...

      - name: Upload generated proof
        if: always() && (steps.generated-proof.outcome == 'success' || steps.generated-proof.outcome == 'failure' || steps.escalation-validation.outcome == 'success' || steps.escalation-validation.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: generated-proof
          path: ${{ runner.temp }}/proof/generated.json
          if-no-files-found: error

      - name: Confirm generated baseline provenance
        if: >-
          (steps.mechanical.outputs.applied == 'true' &&
           steps.generated-proof.outcome == 'success' &&
           steps.owner-local-tests.outcome == 'success' &&
           steps.schema-state.outcome == 'success' &&
           steps.script-tests.outcome == 'success') ||
          steps.escalation-validation.outcome == 'success'
        working-directory: codexsdk
        env:
          RESOLVED_TARGET_KIND: ${{ steps.mechanical.outputs.target_kind }}
          RESOLVED_TARGET_REF: ${{ steps.mechanical.outputs.target_ref }}
          RESOLVED_TARGET_SHA: ${{ steps.mechanical.outputs.target_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("internal/protocolschema/appserver/v2/baseline_metadata.json").read_text(encoding="utf-8"))
          expected = {
              "source_ref_name": os.environ["RESOLVED_TARGET_REF"],
              "source_ref_kind": os.environ["RESOLVED_TARGET_KIND"],
              "source_commit": os.environ["RESOLVED_TARGET_SHA"],
          }
          for key, value in expected.items():
              actual = str(metadata.get(key) or "")
              if actual != value:
                  raise SystemExit(f"protocol implementation {key}={actual!r}, expected {value!r}")
          PY

      - name: Capture final protocol changes
        id: capture
        if: >-
          (steps.mechanical.outputs.applied == 'true' &&
           steps.generated-proof.outcome == 'success' &&
           steps.owner-local-tests.outcome == 'success' &&
           steps.schema-state.outcome == 'success' &&
           steps.script-tests.outcome == 'success') ||
          steps.escalation-validation.outcome == 'success'
        working-directory: codexsdk
        run: |
          python3 scripts/codexsdk_sync_changes.py capture \
            --repo-root "${GITHUB_WORKSPACE}" \
            --phase final \
            --output /tmp/codexsdk-final-changes.json

      - name: Commit validated protocol implementation
        id: commit
        if: >-
          inputs.validation_only != true &&
          ((steps.mechanical.outputs.applied == 'true' &&
            steps.generated-proof.outcome == 'success' &&
            steps.owner-local-tests.outcome == 'success' &&
            steps.schema-state.outcome == 'success' &&
            steps.script-tests.outcome == 'success') ||
           steps.escalation-validation.outcome == 'success')
        working-directory: codexsdk
        env:
          TARGET_KIND: ${{ steps.mechanical.outputs.target_kind }}
          TARGET_REF: ${{ steps.mechanical.outputs.target_ref }}
          TARGET_SHA: ${{ steps.mechanical.outputs.target_sha }}
        run: |
          set -euo pipefail
          python3 scripts/codexsdk_sync_changes.py stage \
            --repo-root "${GITHUB_WORKSPACE}" \
            --manifest /tmp/codexsdk-final-changes.json
          git diff --cached --check
          git -c user.name="codexsdk-sync-bot" \
            -c user.email="codexsdk-sync-bot@users.noreply.github.com" \
            commit \
            -m "Sync Codex protocol baseline to ${TARGET_REF}" \
            -m "Upstream-ref: ${TARGET_REF}" \
            -m "Upstream-ref-kind: ${TARGET_KIND}" \
            -m "Upstream-commit: ${TARGET_SHA}"
          echo "validated_commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Publish protected sync PR
        id: publish
        if: >-
          inputs.validation_only != true &&
          ((steps.mechanical.outputs.applied == 'true' &&
            steps.generated-proof.outcome == 'success' &&
            steps.owner-local-tests.outcome == 'success' &&
            steps.schema-state.outcome == 'success' &&
            steps.script-tests.outcome == 'success') ||
           steps.escalation-validation.outcome == 'success')
        working-directory: codexsdk
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_MODE: ${{ steps.mechanical.outputs.sync_mode }}
          TARGET_KIND: ${{ steps.mechanical.outputs.target_kind }}
          TARGET_REF: ${{ steps.mechanical.outputs.target_ref }}
          TARGET_SHA: ${{ steps.mechanical.outputs.target_sha }}
          VALIDATED_COMMIT: ${{ steps.commit.outputs.validated_commit }}
        run: |
          set -euo pipefail
          gh auth status
          gh auth setup-git
          scripts/codexsdk_publish_sync_pr.sh \
            --land-ref "${DEFAULT_BRANCH}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --branch-prefix "codex/sync-upstream/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target-ref "${TARGET_REF}" \
            --target-kind "${TARGET_KIND}" \
            --target-sha "${TARGET_SHA}" \
            --sync-mode "${SYNC_MODE}" \
            --validated-commit "${VALIDATED_COMMIT}"

      - name: Report protocol sync outcome
        if: >-
          always() &&
          steps.mechanical.outcome == 'success' &&
          (steps.mechanical.outputs.escalate != 'true' || steps.escalation-validation.outcome == 'success') &&
          (steps.mechanical.outputs.escalate == 'true' || steps.generated-proof.outcome == 'success') &&
          (inputs.validation_only == true ||
           (steps.mechanical.outputs.applied != 'true' && steps.mechanical.outputs.escalate != 'true') ||
           (steps.commit.outcome == 'success' && steps.publish.outcome == 'success'))
        env:
          OUTCOME: ${{ steps.mechanical.outputs.outcome }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          PUBLISH: ${{ steps.mechanical.outputs.publish }}
          ESCALATE: ${{ steps.mechanical.outputs.escalate }}
          TARGET_REF: ${{ steps.target.outputs.ref }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          VALIDATION_ONLY: ${{ inputs.validation_only || false }}
          GENERATED_PROOF: ${{ runner.temp }}/proof/generated.json
          OWNER_LOCAL_COMPARE: ${{ steps.owner-local-tests.outcome }}
          OWNER_LOCAL_ESCALATE: ${{ steps.escalation-validation.outcome }}
        run: |
          {
            echo
            echo "## Protocol sync outcome"
            echo
            echo "- Mechanical outcome: \`${OUTCOME}\`"
            echo "- Upstream target: \`${TARGET_REF}\`"
            echo "- Upstream commit: \`${TARGET_SHA}\`"
            echo "- Repository commit: \`${GITHUB_SHA}\`"
            if [[ "${OUTCOME}" == "comparison" || "${OUTCOME}" == "current" ]]; then
              echo "- upstream_schema: clean"
            elif [[ "${OUTCOME}" == "comparison_dirty" ]]; then
              echo "- upstream_schema: drift"
            else
              echo "- upstream_schema: ${OUTCOME}"
            fi
            if [[ -f "${GENERATED_PROOF}" ]]; then
              python3 -c 'import json,os; p=json.load(open(os.environ["GENERATED_PROOF"], encoding="utf-8")); print("- checked_in_generated_go: " + ("reproducible" if p.get("generated_artifacts_reproducible") else "mismatch")); print("- generated proof repository_commit: " + str(p.get("repository_commit") or "")); print("- generated proof upstream_commit: " + str(p.get("upstream_commit") or ""))'
            else
              echo "- checked_in_generated_go: not-run"
            fi
            if [[ "${OWNER_LOCAL_COMPARE}" == "success" || "${OWNER_LOCAL_ESCALATE}" == "success" ]]; then
              echo "- owner_local_tests: pass"
            elif [[ "${OWNER_LOCAL_COMPARE}" == "failure" || "${OWNER_LOCAL_ESCALATE}" == "failure" ]]; then
              echo "- owner_local_tests: fail"
            else
              echo "- owner_local_tests: not-run"
            fi
            if [[ "${ESCALATE}" == "true" ]]; then
              echo "- Escalation: implementation agent received explicit drift evidence after mechanical generation and owner-local Go proofs failed."
            elif [[ "${OUTCOME}" == "implemented" ]]; then
              echo "- Mechanical generation and owner-local Go proofs were sufficient; no implementation agent was invoked."
            elif [[ "${OUTCOME}" == "comparison" ]]; then
              echo "- Read-only comparison found no protocol drift."
            else
              echo "- Checked-in protocol implementation is already current."
            fi
            if [[ "${PUBLISH}" == "true" || "${ESCALATE}" == "true" ]]; then
              if [[ "${VALIDATION_ONLY}" == "true" ]]; then
                echo "- PR validation: protocol implementation validated; commit and publication intentionally skipped."
              else
                echo "- Workflow publication: ${PR_URL}"
              fi
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

name: Codex Upstream Protocol Sync
run-name: "Protocol sync ${{ inputs.upstream_ref || 'latest stable' }}"

on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Optional openai/codex tag, ref, or full SHA. Defaults to the latest stable rust-vX.Y.Z tag."
        required: false
        type: string
      allow_downgrade:
        description: "Allow an explicit stable rust-vX.Y.Z target older than the current stable-tag baseline."
        required: false
        type: boolean
        default: false
      force_compare:
        description: "Generate drift artifacts even when baseline metadata already points at the selected upstream target."
        required: false
        type: boolean
        default: false

defaults:
  run:
    shell: bash
    working-directory: codexsdk

env:
  CODEXSDK_AUTO_SYNC_DIR: .cache/codexsdk-auto-sync
  CODEXSDK_GO_CACHE_DIR: .cache/go-build
  CODEXSDK_GO_MOD_CACHE_DIR: .cache/go-mod
  CODEXSDK_GO_PATH_DIR: .cache/go
  CODEX_UPSTREAM_REPO: https://github.com/openai/codex.git
  CODEXSDK_DRIFT_ARTIFACT_DIR: /tmp/codexsdk-upstream
  CODEXSDK_RUST_TARGET_DIR: .cache/cargo-target/codex
  CODEXSDK_SCHEMA_BASELINE: internal/protocolschema/appserver/v2
  CODEXSDK_SYNC_BRANCH_PREFIX: codex/sync-upstream
  CODEXSDK_TARGET_POLICY_JSON: /tmp/codexsdk-target-policy.json
  CODEXSDK_UPSTREAM_CLONE: /tmp/openai-codex
  CODEXSDK_UPSTREAM_TARGET_JSON: /tmp/codexsdk-upstream-target.json

concurrency:
  group: codex-upstream-protocol-sync
  cancel-in-progress: false

jobs:
  detect:
    name: Detect drift and publish sync PR
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Guard control-plane ref
        working-directory: ${{ github.workspace }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "Refusing to run drift control plane from ${GITHUB_REF_NAME}; use ${DEFAULT_BRANCH}." >&2
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve upstream baseline
        id: refs
        env:
          REQUESTED_UPSTREAM_REF: ${{ inputs.upstream_ref || '' }}
        run: |
          set -euo pipefail

          python3 scripts/codexsdk_resolve_upstream.py \
            --remote "${CODEX_UPSTREAM_REPO}" \
            --upstream-ref "${REQUESTED_UPSTREAM_REF}" \
            --json > "${CODEXSDK_UPSTREAM_TARGET_JSON}"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          target = json.loads(Path(os.environ["CODEXSDK_UPSTREAM_TARGET_JSON"]).read_text())
          metadata = json.loads(Path(os.environ["CODEXSDK_SCHEMA_BASELINE"], "baseline_metadata.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"upstream_ref={target['ref_name']}\n")
              output.write(f"upstream_ref_kind={target['ref_kind']}\n")
              output.write(f"upstream_sha={target['peeled_commit_sha']}\n")
              output.write(f"upstream_short_sha={target['peeled_commit_sha'][:12]}\n")
              output.write(f"baseline_sha={metadata['source_commit']}\n")
              output.write(f"target_explicit={str(target['target_explicit']).lower()}\n")
          PY

          {
            echo "## Codex upstream protocol drift"
            echo
            echo "- Current phase: \`detect\`"
            echo "- Baseline: \`$(python3 -c 'import json, os; print(json.load(open(os.environ["CODEXSDK_SCHEMA_BASELINE"] + "/baseline_metadata.json"))["source_commit"])')\`"
            echo "- Upstream target: \`$(jq -r '.ref_name' "${CODEXSDK_UPSTREAM_TARGET_JSON}")\` (\`$(jq -r '.ref_kind' "${CODEXSDK_UPSTREAM_TARGET_JSON}")\`)"
            echo "- Upstream commit: \`$(jq -r '.peeled_commit_sha' "${CODEXSDK_UPSTREAM_TARGET_JSON}")\`"
            echo "- Explicit target: \`$(jq -r '.target_explicit' "${CODEXSDK_UPSTREAM_TARGET_JSON}")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate target policy
        id: target_policy
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade || false }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TARGET_EXPLICIT: ${{ steps.refs.outputs.target_explicit }}
          TARGET_REF: ${{ steps.refs.outputs.upstream_ref }}
          TARGET_REF_KIND: ${{ steps.refs.outputs.upstream_ref_kind }}
          TARGET_SHA: ${{ steps.refs.outputs.upstream_sha }}
        run: |
          set -euo pipefail

          mode="manual"
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            mode="scheduled"
          fi

          policy_json="$(
            python3 scripts/codexsdk_target_policy.py \
              --baseline "${CODEXSDK_SCHEMA_BASELINE}/baseline_metadata.json" \
              --target-ref "${TARGET_REF}" \
              --target-kind "${TARGET_REF_KIND}" \
              --target-sha "${TARGET_SHA}" \
              --target-explicit "${TARGET_EXPLICIT}" \
              --mode "${mode}" \
              --allow-downgrade "${ALLOW_DOWNGRADE}" \
              --json
          )"
          printf '%s\n' "${policy_json}" | tee "${CODEXSDK_TARGET_POLICY_JSON}"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          policy = json.loads(Path(os.environ["CODEXSDK_TARGET_POLICY_JSON"]).read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key in (
                  "decision",
                  "reason",
                  "baseline_ref_name",
                  "baseline_ref_kind",
                  "baseline_commit",
                  "target_ref_name",
                  "target_ref_kind",
                  "target_commit",
                  "target_explicit",
                  "mode",
              ):
                  output.write(f"{key}={policy[key]}\n")
          PY

          {
            echo
            echo "## Target policy"
            echo
            echo "- Decision: \`$(jq -r '.decision' "${CODEXSDK_TARGET_POLICY_JSON}")\`"
            echo "- Reason: $(jq -r '.reason' "${CODEXSDK_TARGET_POLICY_JSON}")"
            echo "- Baseline target: \`$(jq -r '.baseline_commit' "${CODEXSDK_TARGET_POLICY_JSON}")\`"
            echo "- Requested target: \`${TARGET_REF}\` (\`${TARGET_REF_KIND}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Plan drift execution
        id: pre_plan
        env:
          FORCE_COMPARE: ${{ inputs.force_compare || false }}
          POLICY_DECISION: ${{ steps.target_policy.outputs.decision }}
          POLICY_REASON: ${{ steps.target_policy.outputs.reason }}
        run: |
          set -euo pipefail

          python3 scripts/codexsdk_sync_workflow_plan.py \
            --policy-decision "${POLICY_DECISION}" \
            --force-compare "${FORCE_COMPARE}" \
            --json

          {
            echo
            echo "## Workflow plan"
            echo
            echo "- Policy decision: \`${POLICY_DECISION}\`"
            echo "- Reason: ${POLICY_REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip when target policy is current
        if: steps.pre_plan.outputs.mode == 'noop'
        env:
          UPSTREAM_REF: ${{ steps.refs.outputs.upstream_ref }}
        run: |
          echo "Baseline already points at the selected openai/codex upstream target: ${UPSTREAM_REF}." >> "$GITHUB_STEP_SUMMARY"

      - name: Stop when target policy blocks drift detection
        if: steps.pre_plan.outputs.mode == 'blocked' || steps.pre_plan.outputs.mode == 'verification-fail'
        env:
          POLICY_REASON: ${{ steps.target_policy.outputs.reason }}
        run: |
          {
            echo "Protocol drift generation was skipped by target policy."
            echo
            echo "Reason: ${POLICY_REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clone upstream Codex
        if: steps.pre_plan.outputs.should_detect == 'true'
        run: |
          git clone --filter=blob:none --no-checkout "${CODEX_UPSTREAM_REPO}" "${CODEXSDK_UPSTREAM_CLONE}"

      - name: Set up Codex Rust
        if: steps.pre_plan.outputs.should_detect == 'true'
        uses: ./.github/actions/setup-codex-rust
        with:
          cache-key-suffix: ${{ steps.refs.outputs.upstream_short_sha }}
          target-dir: codexsdk/${{ env.CODEXSDK_RUST_TARGET_DIR }}

      - name: Generate drift report
        if: steps.pre_plan.outputs.should_detect == 'true'
        env:
          UPSTREAM_REF: ${{ steps.refs.outputs.upstream_ref }}
          UPSTREAM_REF_KIND: ${{ steps.refs.outputs.upstream_ref_kind }}
          UPSTREAM_SHA: ${{ steps.refs.outputs.upstream_sha }}
        run: |
          CARGO_TARGET_DIR="$PWD/${CODEXSDK_RUST_TARGET_DIR}" \
            scripts/codexsdk_track_upstream.sh \
            --codex-repo "${CODEXSDK_UPSTREAM_CLONE}" \
            --commit "${UPSTREAM_SHA}" \
            --source-ref "${UPSTREAM_REF}" \
            --source-ref-kind "${UPSTREAM_REF_KIND}" \
            --out "${CODEXSDK_DRIFT_ARTIFACT_DIR}"

      - name: Prepare drift PR analysis
        if: steps.pre_plan.outputs.should_detect == 'true'
        id: drift
        env:
          BASELINE_SHA: ${{ steps.refs.outputs.baseline_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPSTREAM_REF: ${{ steps.refs.outputs.upstream_ref }}
          UPSTREAM_REF_KIND: ${{ steps.refs.outputs.upstream_ref_kind }}
          UPSTREAM_SHA: ${{ steps.refs.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          python3 scripts/codexsdk_write_drift_pr_analysis.py \
            --artifact-dir "${CODEXSDK_DRIFT_ARTIFACT_DIR}" \
            --baseline-sha "${BASELINE_SHA}" \
            --run-url "${RUN_URL}" \
            --upstream-ref "${UPSTREAM_REF}" \
            --upstream-ref-kind "${UPSTREAM_REF_KIND}" \
            --upstream-sha "${UPSTREAM_SHA}"

      - name: Upload drift evidence
        if: steps.pre_plan.outputs.should_detect == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-upstream-drift-${{ steps.refs.outputs.upstream_sha }}-${{ steps.drift.outputs.drift_sha }}
          path: ${{ env.CODEXSDK_DRIFT_ARTIFACT_DIR }}
          if-no-files-found: error

      - name: Plan sync action
        id: plan
        if: steps.pre_plan.outputs.should_detect == 'true'
        env:
          DRIFT_STATUS: ${{ steps.drift.outputs.status }}
          FORCE_COMPARE: ${{ inputs.force_compare || false }}
          POLICY_DECISION: ${{ steps.target_policy.outputs.decision }}
        run: |
          set -euo pipefail
          python3 scripts/codexsdk_sync_workflow_plan.py \
            --policy-decision "${POLICY_DECISION}" \
            --force-compare "${FORCE_COMPARE}" \
            --drift-status "${DRIFT_STATUS}" \
            --json

      - name: Set up Go
        if: steps.plan.outputs.needs_apply == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: codexsdk/go.mod
          cache: false

      - name: Guard clean sync worktree
        if: steps.plan.outputs.needs_apply == 'true'
        run: |
          set -euo pipefail
          python3 scripts/codexsdk_sync_changes.py assert-clean \
            --repo-root "${GITHUB_WORKSPACE}"

      - name: Apply sync candidate mechanically
        if: steps.plan.outputs.needs_apply == 'true'
        env:
          CANDIDATE_DIR: ${{ env.CODEXSDK_DRIFT_ARTIFACT_DIR }}
          UPSTREAM_REF: ${{ steps.refs.outputs.upstream_ref }}
          UPSTREAM_REF_KIND: ${{ steps.refs.outputs.upstream_ref_kind }}
          UPSTREAM_SHA: ${{ steps.refs.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          mkdir -p "${CODEXSDK_AUTO_SYNC_DIR}"
          python3 scripts/codexsdk_apply_sync_candidate.py \
            --candidate "${CANDIDATE_DIR}/schema" \
            --stable-candidate "${CANDIDATE_DIR}/stable-schema" \
            --codex-repo "${CODEXSDK_UPSTREAM_CLONE}" \
            --reports "${CANDIDATE_DIR}/reports" \
            --common-rs "${CANDIDATE_DIR}/common.rs" \
            --common-rs-source-sha "${UPSTREAM_SHA}" \
            --target-ref "${UPSTREAM_REF}" \
            --target-kind "${UPSTREAM_REF_KIND}" \
            --target-sha "${UPSTREAM_SHA}" \
            --json | tee "${CODEXSDK_AUTO_SYNC_DIR}/apply-result.json"
          python3 scripts/codexsdk_sync_changes.py capture \
            --repo-root "${GITHUB_WORKSPACE}" \
            --phase mechanical \
            --output "${CODEXSDK_AUTO_SYNC_DIR}/mechanical-changes.json"

      - name: Build Codex drift repair prompt
        if: steps.plan.outputs.needs_agent == 'true'
        env:
          CANDIDATE_DIR: ${{ env.CODEXSDK_DRIFT_ARTIFACT_DIR }}
          LAND_REF: ${{ github.event.repository.default_branch }}
          UPSTREAM_REF: ${{ steps.refs.outputs.upstream_ref }}
          UPSTREAM_REF_KIND: ${{ steps.refs.outputs.upstream_ref_kind }}
          UPSTREAM_SHA: ${{ steps.refs.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          mkdir -p "${CODEXSDK_AUTO_SYNC_DIR}"
          python3 scripts/codexsdk_write_sync_prompt.py \
            --out "${CODEXSDK_AUTO_SYNC_DIR}/prompt.md" \
            --auto-sync-dir "codexsdk/${CODEXSDK_AUTO_SYNC_DIR}" \
            --candidate-dir "${CANDIDATE_DIR}" \
            --land-ref "${LAND_REF}" \
            --phase "fix" \
            --upstream-ref "${UPSTREAM_REF}" \
            --upstream-ref-kind "${UPSTREAM_REF_KIND}" \
            --upstream-sha "${UPSTREAM_SHA}"

      - name: Prepare Go validation cache for Codex repair
        if: steps.plan.outputs.needs_agent == 'true'
        env:
          GOCACHE: ${{ github.workspace }}/codexsdk/${{ env.CODEXSDK_GO_CACHE_DIR }}
          GOMODCACHE: ${{ github.workspace }}/codexsdk/${{ env.CODEXSDK_GO_MOD_CACHE_DIR }}
          GOPATH: ${{ github.workspace }}/codexsdk/${{ env.CODEXSDK_GO_PATH_DIR }}
        run: |
          set -euo pipefail
          mkdir -p "${GOCACHE}" "${GOMODCACHE}" "${GOPATH}"
          GOWORK=off go list -deps -test ./... >/dev/null

      - name: Run Codex drift repair agent
        if: steps.plan.outputs.needs_agent == 'true'
        uses: openai/codex-action@v1
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/codexsdk/${{ env.CODEXSDK_RUST_TARGET_DIR }}
          GOCACHE: ${{ github.workspace }}/codexsdk/${{ env.CODEXSDK_GO_CACHE_DIR }}
          GOMODCACHE: ${{ github.workspace }}/codexsdk/${{ env.CODEXSDK_GO_MOD_CACHE_DIR }}
          GOPATH: ${{ github.workspace }}/codexsdk/${{ env.CODEXSDK_GO_PATH_DIR }}
        with:
          openai-api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.CODEX_RESPONSES_API_ENDPOINT }}
          model: gpt-5.6-sol
          effort: high
          prompt-file: codexsdk/${{ env.CODEXSDK_AUTO_SYNC_DIR }}/prompt.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          allow-bots: "true"
          codex-args: '["--ephemeral"]'

      - name: Capture final sync change set
        if: steps.plan.outputs.needs_apply == 'true'
        run: |
          set -euo pipefail
          python3 scripts/codexsdk_sync_changes.py capture \
            --repo-root "${GITHUB_WORKSPACE}" \
            --phase final \
            --output "${CODEXSDK_AUTO_SYNC_DIR}/final-changes.json"

      - name: Validate sync before commit
        if: steps.plan.outputs.needs_apply == 'true'
        env:
          CANDIDATE_DIR: ${{ env.CODEXSDK_DRIFT_ARTIFACT_DIR }}
          GOCACHE: ${{ github.workspace }}/codexsdk/${{ env.CODEXSDK_GO_CACHE_DIR }}
          GOMODCACHE: ${{ github.workspace }}/codexsdk/${{ env.CODEXSDK_GO_MOD_CACHE_DIR }}
          GOPATH: ${{ github.workspace }}/codexsdk/${{ env.CODEXSDK_GO_PATH_DIR }}
          UPSTREAM_SHA: ${{ steps.refs.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          scripts/codexsdk_validate_sync.sh \
            --candidate "${CANDIDATE_DIR}/schema" \
            --target-sha "${UPSTREAM_SHA}"

      - name: Commit local sync changes
        id: commit
        if: steps.plan.outputs.needs_publish == 'true'
        env:
          UPSTREAM_REF: ${{ steps.refs.outputs.upstream_ref }}
          UPSTREAM_REF_KIND: ${{ steps.refs.outputs.upstream_ref_kind }}
          UPSTREAM_SHA: ${{ steps.refs.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          echo "Using codexsdk-sync-upstream command: commit-local-sync."
          python3 scripts/codexsdk_sync_changes.py stage \
            --repo-root "${GITHUB_WORKSPACE}" \
            --manifest "${CODEXSDK_AUTO_SYNC_DIR}/final-changes.json"
          if git diff --cached --quiet; then
            echo "No staged sync changes are available to commit." >&2
            exit 1
          fi
          git -c user.name="codexsdk-sync-bot" \
            -c user.email="codexsdk-sync-bot@users.noreply.github.com" \
            commit \
            -m "Sync Codex protocol baseline to ${UPSTREAM_REF}" \
            -m "Upstream-ref: ${UPSTREAM_REF}" \
            -m "Upstream-ref-kind: ${UPSTREAM_REF_KIND}" \
            -m "Upstream-commit: ${UPSTREAM_SHA}"
          echo "validated_commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Publish protected sync PR
        id: publish
        if: steps.plan.outputs.needs_publish == 'true'
        env:
          CANDIDATE_DIR: ${{ env.CODEXSDK_DRIFT_ARTIFACT_DIR }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRIFT_SHA: ${{ steps.drift.outputs.drift_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_MODE: ${{ steps.plan.outputs.mode }}
          UPSTREAM_REF: ${{ steps.refs.outputs.upstream_ref }}
          UPSTREAM_REF_KIND: ${{ steps.refs.outputs.upstream_ref_kind }}
          UPSTREAM_SHA: ${{ steps.refs.outputs.upstream_sha }}
          VALIDATED_COMMIT: ${{ steps.commit.outputs.validated_commit }}
        run: |
          set -euo pipefail
          gh auth setup-git
          args=(
            --land-ref "${DEFAULT_BRANCH}"
            --default-branch "${DEFAULT_BRANCH}"
            --branch-prefix "${CODEXSDK_SYNC_BRANCH_PREFIX}"
            --target-ref "${UPSTREAM_REF}"
            --target-kind "${UPSTREAM_REF_KIND}"
            --target-sha "${UPSTREAM_SHA}"
            --drift-sha "${DRIFT_SHA}"
            --drift-analysis "${CANDIDATE_DIR}/drift-analysis.md"
            --candidate "${CANDIDATE_DIR}/schema"
            --sync-mode "${SYNC_MODE}"
            --validated-commit "${VALIDATED_COMMIT}"
          )
          scripts/codexsdk_publish_sync_pr.sh "${args[@]}"

      - name: Report sync PR outcome
        if: steps.publish.outputs.pr_url != ''
        env:
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          SYNC_BRANCH: ${{ steps.publish.outputs.sync_branch }}
          SYNC_COMMIT: ${{ steps.publish.outputs.sync_commit }}
        run: |
          {
            echo
            echo "## Sync PR published"
            echo
            echo "- Completion layer: \`sync PR published\`"
            echo "- Sync branch: \`${SYNC_BRANCH}\`"
            echo "- Sync commit: \`${SYNC_COMMIT}\`"
            echo "- Sync PR: ${PR_URL}"
            echo
            echo "Branch protection and the required \`PR verification\` check own the merge gate. An authorized maintainer owns the merge decision. The finalize workflow owns landed verification, sync tags, and drift verification."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail forced verification
        if: always() && (steps.pre_plan.outputs.verification_failed == 'true' || steps.plan.outputs.verification_failed == 'true')
        env:
          DRIFT_STATUS: ${{ steps.drift.outputs.status }}
          POLICY_REASON: ${{ steps.target_policy.outputs.reason }}
        run: |
          echo "force_compare verification failed (policy: ${POLICY_REASON}; drift: ${DRIFT_STATUS:-not-generated})." >&2
          exit 1

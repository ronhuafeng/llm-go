name: Migration acceptance audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-acceptance
  cancel-in-progress: false

jobs:
  plan:
    name: Exact main source plan
    runs-on: ubuntu-latest
    outputs:
      public_modules: ${{ steps.plan.outputs.public_modules || '[]' }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: internal/tools/go.sum
      - name: Record exact main source
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select every registered module at exact main
        id: plan
        working-directory: internal/tools
        env:
          GOWORK: "off"
        run: |
          go run ./cmd/repoctl affected -root ../.. -head HEAD -output ../../acceptance-plan.json
          echo "public_modules=$(jq -c '.public_modules' ../../acceptance-plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: acceptance-plan
          path: acceptance-plan.json

  minimum:
    name: Minimum Go (${{ matrix.module.id }})
    needs: plan
    if: needs.plan.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.public_modules) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: internal/tools/go.sum
      - name: Build typed repository tool
        working-directory: internal/tools
        env:
          GOWORK: "off"
        run: go build -o "$RUNNER_TEMP/repoctl" ./cmd/repoctl
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.module.minimum_go }}
          cache-dependency-path: ${{ matrix.module.dir }}/go.sum
      - name: Verify standalone module at its minimum Go
        working-directory: internal/tools
        run: >-
          "$RUNNER_TEMP/repoctl" verify-module -root ../..
          -module "${{ matrix.module.id }}" -stage minimum
          -evidence "../../evidence-${{ matrix.module.id }}-minimum.json"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-evidence-${{ matrix.module.id }}-minimum
          path: evidence-${{ matrix.module.id }}-minimum.json

  current:
    name: Current Go (${{ matrix.module.id }})
    needs: plan
    if: needs.plan.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.public_modules) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: ${{ matrix.module.dir }}/go.sum
      - name: Verify standalone module on current Go
        working-directory: internal/tools
        env:
          GOWORK: "off"
        run: >-
          go run ./cmd/repoctl verify-module -root ../..
          -module "${{ matrix.module.id }}" -stage current
          -evidence "../../evidence-${{ matrix.module.id }}-current.json"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-evidence-${{ matrix.module.id }}-current
          path: evidence-${{ matrix.module.id }}-current.json

  race:
    name: Race (${{ matrix.module.id }})
    needs: plan
    if: needs.plan.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.public_modules) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: ${{ matrix.module.dir }}/go.sum
      - name: Verify standalone module with race detector
        working-directory: internal/tools
        env:
          GOWORK: "off"
        run: >-
          go run ./cmd/repoctl verify-module -root ../..
          -module "${{ matrix.module.id }}" -stage race
          -evidence "../../evidence-${{ matrix.module.id }}-race.json"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-evidence-${{ matrix.module.id }}-race
          path: evidence-${{ matrix.module.id }}-race.json

  checkout:
    name: Checkout composition
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: |
            internal/tools/go.sum
            llmkit/go.sum
            codexsdk/go.sum
            llmcaller/codex/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: acceptance-plan
      - name: Verify source consumers and three-layer composition
        working-directory: internal/tools
        run: >-
          go run ./cmd/repoctl verify-checkout -root ../..
          -plan ../../acceptance-plan.json -evidence ../../evidence-checkout.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-evidence-checkout
          path: evidence-checkout.json

  audit:
    name: Complete migration acceptance report
    needs: [plan, minimum, current, race, checkout]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.commit || 'main' }}
      - name: Record audited source identity
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: |
            internal/tools/go.sum
            llmkit/go.sum
            codexsdk/go.sum
            llmcaller/codex/go.sum
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: acceptance-evidence-*
          path: source-evidence
          merge-multiple: true
      - name: Audit all accepted migration evidence categories
        working-directory: internal/tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOWORK: "off"
        run: >-
          go run ./cmd/repoctl migration-audit -root ../..
          -source-evidence ../../source-evidence
          -output ../../migration-acceptance-report.json
      - name: Upload authoritative acceptance report
        if: always()
        id: report
        uses: actions/upload-artifact@v7
        with:
          name: migration-acceptance-${{ steps.source.outputs.commit }}
          path: migration-acceptance-report.json
      - name: Record artifact identity
        if: always()
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
          ARTIFACT_DIGEST: ${{ steps.report.outputs.artifact-digest }}
        run: |
          echo "Exact main commit: \`$COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Acceptance artifact digest: \`$ARTIFACT_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

name: Advisory OS portability

on:
  schedule:
    - cron: "23 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root:
    name: Root module
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        env:
          GOTOOLCHAIN: local
        run: go vet ./...

      - name: Test
        env:
          GOTOOLCHAIN: local
        run: go test ./...

name: Post-release module resolution smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing module-prefixed tag, for example llmkit/v0.12.0
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}

jobs:
  resolve:
    name: Observe public module resolution
    if: >-
      (startsWith(inputs.tag, 'llmkit/v') ||
       startsWith(inputs.tag, 'codexsdk/v') ||
       startsWith(inputs.tag, 'llmcaller/codex/v')) &&
      !contains(inputs.tag, '-') &&
      !contains(inputs.tag, '+')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: false

      - name: Resolve released module once
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOPRIVATE: ""
        run: |
          set -euo pipefail
          tag="${TAG:?tag is required}"
          case "${tag}" in
            llmkit/v*)
              module="github.com/ronhuafeng/llm-go/llmkit"
              version="${tag#llmkit/}"
              ;;
            codexsdk/v*)
              module="github.com/ronhuafeng/llm-go/codexsdk"
              version="${tag#codexsdk/}"
              ;;
            llmcaller/codex/v*)
              module="github.com/ronhuafeng/llm-go/llmcaller/codex"
              version="${tag#llmcaller/codex/}"
              ;;
            *)
              echo "skipping ${tag}: not a public module tag"
              exit 0
              ;;
          esac
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "skipping ${tag}: not a stable module version; this job does not judge tag validity"
            exit 0
          fi

          echo "tag=${tag}"
          echo "module=${module}"
          echo "version=${version}"
          echo "This job observes public proxy resolution only. It does not validate, move, or recreate the immutable tag."

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          cd "${workdir}"
          go mod init example.com/llm-go-release-smoke
          go get "${module}@${version}"
          go list -m "${module}"
          go list "${module}/..."

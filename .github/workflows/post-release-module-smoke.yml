name: Post-release module resolution smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing root module tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}

jobs:
  resolve:
    name: Observe public module resolution
    if: >-
      startsWith(inputs.tag, 'v') &&
      !contains(inputs.tag, '/') &&
      !contains(inputs.tag, '-') &&
      !contains(inputs.tag, '+')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Resolve released module once
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOPRIVATE: ""
        run: |
          set -euo pipefail
          tag="${TAG:?tag is required}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "skipping ${tag}: not a stable root module version; this job does not judge tag validity" >&2
            exit 0
          fi

          echo "tag=${tag}"
          echo "module=github.com/ronhuafeng/llm-go"
          echo "This job observes public proxy resolution only. It does not validate, move, or recreate the immutable tag."

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          cd "${workdir}"
          go mod init example.com/llm-go-release-smoke
          cat > main.go <<'EOF'
          package main

          import (
          _ "github.com/ronhuafeng/llm-go/codexsdk"
          _ "github.com/ronhuafeng/llm-go/llmcaller/codex"
          _ "github.com/ronhuafeng/llm-go/llmkit/llmschema"
          )

          func main() {}
          EOF
          go get "github.com/ronhuafeng/llm-go@${tag}"
          go mod tidy
          go list -m github.com/ronhuafeng/llm-go
          go list github.com/ronhuafeng/llm-go/llmkit/llmschema github.com/ronhuafeng/llm-go/codexsdk github.com/ronhuafeng/llm-go/llmcaller/codex
          go build -o /dev/null .

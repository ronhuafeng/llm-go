name: Auto-forward PR
run-name: "Auto-forward PR #${{ inputs.pr_number }}"

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      expected_head:
        required: true
        type: string
      verification_base:
        required: true
        type: string
      original_base:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_kind:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      deadline:
        required: true
        type: string
    secrets:
      AUTO_FORWARD_APP_PRIVATE_KEY:
        required: true
      AZURE_OPENAI_API_KEY:
        required: false
      CODEX_RESPONSES_API_ENDPOINT:
        required: false
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open same-repository PR to reconcile and fast-forward into main."
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: auto-forward-main
  cancel-in-progress: false

jobs:
  integrate:
    name: Bounded exact-head convergence
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Require trusted main and complete native handoff
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD: ${{ inputs.expected_head }}
          ORIGINAL_BASE: ${{ inputs.original_base }}
          VERIFICATION_BASE: ${{ inputs.verification_base }}
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_KIND: ${{ inputs.target_kind }}
          TARGET_SHA: ${{ inputs.target_sha }}
          DEADLINE: ${{ inputs.deadline }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}"
          if [[ -n "${HEAD}${ORIGINAL_BASE}${VERIFICATION_BASE}${TARGET_REF}${TARGET_KIND}${TARGET_SHA}${DEADLINE}" ]]; then
            test -n "${HEAD}" && test -n "${ORIGINAL_BASE}" && test -n "${VERIFICATION_BASE}"
            test -n "${TARGET_REF}" && test -n "${TARGET_KIND}" && test -n "${TARGET_SHA}" && test -n "${DEADLINE}"
            test "$(date -u -d "${DEADLINE}" +%s)" -gt "$(date -u +%s)"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Bind existing candidate and original deadline
        id: binding
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD: ${{ inputs.expected_head }}
          DEADLINE: ${{ inputs.deadline }}
          ORIGINAL_BASE: ${{ inputs.original_base }}
          VERIFICATION_BASE: ${{ inputs.verification_base }}
        run: |
          set -euo pipefail
          if [[ -z "${HEAD}" ]]; then HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"; fi
          # Only legacy manual FF gets a new bounded execution at first entry.
          if [[ -z "${DEADLINE}" ]]; then DEADLINE="$(date -u -d '+30 minutes' +%Y-%m-%dT%H:%M:%SZ)"; fi
          test "$(date -u -d "${DEADLINE}" +%s)" -gt "$(date -u +%s)"
          if [[ -z "${ORIGINAL_BASE}" ]]; then
            ORIGINAL_BASE="$(git ls-remote origin refs/heads/main | cut -f1)"
            [[ "${ORIGINAL_BASE}" =~ ^[0-9a-f]{40}$ ]]
            VERIFICATION_BASE="${ORIGINAL_BASE}"
          fi
          {
            echo "original_base=${ORIGINAL_BASE}"
            echo "verification_base=${VERIFICATION_BASE}"
            echo "head=${HEAD}"
            echo "deadline=${DEADLINE}"
          } >> "${GITHUB_OUTPUT}"
          go build -o "${RUNNER_TEMP}/protocolupgrade" ./codexsdk/internal/cmd/protocolupgrade
      - name: Provision credential-free generic baseline proof
        if: inputs.target_sha == ''
        env:
          HOSTED_ENVIRONMENT: ${{ runner.environment }}
          DEADLINE: ${{ steps.binding.outputs.deadline }}
        run: |
          set -euo pipefail
          test "${HOSTED_ENVIRONMENT}" = github-hosted
          test "$(date -u -d "${DEADLINE}" +%s)" -gt "$(date -u +%s)"
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          go mod download
      - name: Provision existing credential-free verification and repair sandbox
        if: inputs.target_sha != ''
        env:
          HOSTED_ENVIRONMENT: ${{ runner.environment }}
          DEADLINE: ${{ steps.binding.outputs.deadline }}
        run: |
          set -euo pipefail
          test "${HOSTED_ENVIRONMENT}" = github-hosted
          test "$(date -u -d "${DEADLINE}" +%s)" -gt "$(date -u +%s)"
          sudo apt-get update
          sudo apt-get install -y bubblewrap clang cmake libasound2-dev libssl-dev pkg-config protobuf-compiler
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          rustup default stable
          mkdir -p "${RUNNER_TEMP}/repair-rust-tools"
          cp "$(command -v rustup)" "${RUNNER_TEMP}/repair-rust-tools/rustup"
          for tool in cargo rustc rustdoc; do ln -s rustup "${RUNNER_TEMP}/repair-rust-tools/${tool}"; done
      - name: Resolve official repair runtime once
        if: inputs.target_sha != ''
        id: runtime
        uses: ./.github/actions/setup-codex
      - name: Prewarm fixed upstream inputs before any App/provider credential
        if: inputs.target_sha != ''
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_KIND: ${{ inputs.target_kind }}
          TARGET_SHA: ${{ inputs.target_sha }}
          DEADLINE: ${{ steps.binding.outputs.deadline }}
        run: |
          set -euo pipefail
          remaining=$(( $(date -u -d "${DEADLINE}" +%s) - $(date -u +%s) ))
          test "${remaining}" -gt 0
          timeout --signal=TERM "${remaining}s" "${RUNNER_TEMP}/protocolupgrade" diagnose \
            -repo-root "${GITHUB_WORKSPACE}" -module-root "${GITHUB_WORKSPACE}/codexsdk" \
            -upstream-ref "${TARGET_REF}" -json > "${RUNNER_TEMP}/forward-source.json"
          jq -e --arg ref "${TARGET_REF}" --arg kind "${TARGET_KIND}" --arg sha "${TARGET_SHA}" \
            '.Target.RefName == $ref and .Target.RefKind == $kind and .Target.PeeledCommitSHA == $sha' \
            "${RUNNER_TEMP}/forward-source.json" > /dev/null
          if [[ "${TARGET_KIND}" == stable_rust_tag ]]; then
            git -C codexsdk/.cache/openai-codex fetch --no-tags origin "refs/tags/${TARGET_REF}:refs/tags/${TARGET_REF}"
          fi
          go mod tidy -diff
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          git diff --exit-code
      - name: Resolve existing repository-scoped integration identity
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTO_FORWARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_FORWARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
      - name: Bind actual integration App actor
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          set -euo pipefail
          actor="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          [[ "${actor}" =~ ^[1-9][0-9]*$ ]]
          echo "actor=${actor}" >> "${GITHUB_OUTPUT}"
      - name: Reconcile, prove each M/H, require four checks, and fast-forward
        id: forward
        env:
          GH_READ_TOKEN: ${{ github.token }}
          AUTO_FORWARD_APP_CLIENT_ID: ${{ vars.AUTO_FORWARD_APP_CLIENT_ID }}
          AUTO_FORWARD_APP_INSTALLATION_ID: ${{ steps.app_token.outputs.installation-id }}
          AUTO_FORWARD_APP_PRIVATE_KEY: ${{ secrets.AUTO_FORWARD_APP_PRIVATE_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          CODEX_RESPONSES_API_ENDPOINT: ${{ secrets.CODEX_RESPONSES_API_ENDPOINT }}
          CODEX_CLI_VERSION: ${{ steps.runtime.outputs.version }}
          AUTO_FORWARD_DIAGNOSTICS: ${{ runner.temp }}/forward-diagnostics
          AUTO_FORWARD_SOURCE: ${{ runner.temp }}/forward-source.json
          AUTO_FORWARD_RUST_TOOLS: ${{ runner.temp }}/repair-rust-tools
          PUBLICATION_ACTOR: ${{ vars.PROTOCOL_SYNC_APP_BOT_ID }}
          INTEGRATION_ACTOR: ${{ steps.identity.outputs.actor }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD: ${{ steps.binding.outputs.head }}
          ORIGINAL_BASE: ${{ steps.binding.outputs.original_base }}
          VERIFICATION_BASE: ${{ steps.binding.outputs.verification_base }}
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_KIND: ${{ inputs.target_kind }}
          TARGET_SHA: ${{ inputs.target_sha }}
          DEADLINE: ${{ steps.binding.outputs.deadline }}
        run: |
          set -euo pipefail
          # Keys stay in this trusted parent. Existing GoalSandbox exposes only
          # provider access to the fresh runtime; no App sockets/brokers exist.
          # Each branch/main write mints and revokes its own narrow App token.
          "${RUNNER_TEMP}/protocolupgrade" auto-forward \
            -controller-root "${GITHUB_WORKSPACE}" -repository "${GITHUB_REPOSITORY}" \
            -pr-number "${PR_NUMBER}" -expected-head "${HEAD}" -deadline "${DEADLINE}" \
            -original-base "${ORIGINAL_BASE}" -verification-base "${VERIFICATION_BASE}" \
            -target-ref "${TARGET_REF}" -target-kind "${TARGET_KIND}" -target-sha "${TARGET_SHA}" \
            -publication-app-bot-id "${PUBLICATION_ACTOR:-0}" -integration-app-bot-id "${INTEGRATION_ACTOR}" \
            | tee "${RUNNER_TEMP}/forward-result.json"
      - name: Retain safe integration observation
        if: always()
        env:
          RESULT: ${{ runner.temp }}/forward-result.json
        run: |
          if [[ -f "${RESULT}" ]]; then
            { echo '## Exact-head Auto-forward'; jq -r '"- Status: \(.status)\n- H: \(.head)\n- Main: \(.main)\n- Reason: \(.reason // "")"' "${RESULT}"; } >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Retain safe verifier diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auto-forward-${{ inputs.pr_number }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/forward-result.json
            ${{ runner.temp }}/forward-diagnostics/**/*.jsonl
          if-no-files-found: ignore
          retention-days: 7

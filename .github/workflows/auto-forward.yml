name: Auto-forward PR
run-name: "Auto-forward PR #${{ inputs.pr_number }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open same-repository PR to fast-forward into the default branch."
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: auto-forward-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify auto-forwardable head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      head: ${{ steps.candidate.outputs.head }}
      base: ${{ steps.candidate.outputs.base }}
      head_ref: ${{ steps.candidate.outputs.head_ref }}
    steps:
      - name: Require trusted default-branch control
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "auto-forward must be dispatched from ${DEFAULT_BRANCH}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state' <<<"${pr}")"
          draft="$(jq -r '.draft' <<<"${pr}")"
          base_ref="$(jq -r '.base.ref' <<<"${pr}")"
          head_ref="$(jq -r '.head.ref' <<<"${pr}")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<<"${pr}")"

          if [[ "${state}" != open || "${draft}" != false || "${base_ref}" != "${DEFAULT_BRANCH}" ]]; then
            echo "PR #${PR_NUMBER} is not an open non-draft PR against ${DEFAULT_BRANCH}" >&2
            exit 1
          fi
          if [[ "${head_repo}" != "${REPOSITORY}" || -z "${head_ref}" ]]; then
            echo "auto-forward currently requires a same-repository PR head" >&2
            exit 1
          fi

          head_line="$(git ls-remote "https://github.com/${REPOSITORY}.git" "refs/heads/${head_ref}")"
          base_line="$(git ls-remote "https://github.com/${REPOSITORY}.git" "refs/heads/${DEFAULT_BRANCH}")"
          head="$(awk '{print $1}' <<<"${head_line}")"
          base="$(awk '{print $1}' <<<"${base_line}")"
          if [[ ! "${head}" =~ ^[0-9a-f]{40}$ || ! "${base}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "failed to resolve exact PR/main Git refs" >&2
            exit 1
          fi

          git fetch --no-tags origin "${base}" "${head}"
          if ! git merge-base --is-ancestor "${base}" "${head}"; then
            echo "PR #${PR_NUMBER} is stale: current main ${base} is not an ancestor of H ${head}" >&2
            exit 1
          fi

          {
            echo "head=${head}"
            echo "base=${base}"
            echo "head_ref=${head_ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Require current-head checks and review policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.candidate.outputs.head }}
        run: &require_acceptance |
          set -euo pipefail
          required=(
            "Root source verification"
            "Codex generated reproducibility / Generated reproducibility"
            "Codex protocol provenance"
          )
          checks="$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100")"
          for name in "${required[@]}"; do
            ok="$(jq --arg name "${name}" '[.check_runs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length' <<<"${checks}")"
            if [[ "${ok}" -lt 1 ]]; then
              echo "required check is not successful on H ${HEAD_SHA}: ${name}" >&2
              exit 1
            fi
          done

          decision="$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json reviewDecision --jq '.reviewDecision // ""')"
          case "${decision}" in
            CHANGES_REQUESTED|REVIEW_REQUIRED)
              echo "review policy is not satisfied for current H ${HEAD_SHA}: ${decision}" >&2
              exit 1
              ;;
          esac

  forward:
    name: Fast-forward verified head
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Check integration App configuration
        env:
          APP_CONFIGURED: ${{ vars.AUTO_FORWARD_APP_CLIENT_ID != '' && secrets.AUTO_FORWARD_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "${APP_CONFIGURED}" != true ]]; then
            echo "::error::Configure AUTO_FORWARD_APP_CLIENT_ID and AUTO_FORWARD_APP_PRIVATE_KEY for a repository-scoped GitHub App allowed to fast-forward protected main with Contents: write." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate current candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ needs.verify.outputs.head }}
          EXPECTED_HEAD_REF: ${{ needs.verify.outputs.head_ref }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          if [[ "$(jq -r '.state' <<<"${pr}")" != open ||
                "$(jq -r '.draft' <<<"${pr}")" != false ||
                "$(jq -r '.base.ref' <<<"${pr}")" != "${DEFAULT_BRANCH}" ||
                "$(jq -r '.head.repo.full_name // empty' <<<"${pr}")" != "${REPOSITORY}" ||
                "$(jq -r '.head.ref' <<<"${pr}")" != "${EXPECTED_HEAD_REF}" ]]; then
            echo "PR identity changed after verification" >&2
            exit 1
          fi

          current_head="$(git ls-remote "https://github.com/${REPOSITORY}.git" "refs/heads/${EXPECTED_HEAD_REF}" | awk '{print $1}')"
          current_base="$(git ls-remote "https://github.com/${REPOSITORY}.git" "refs/heads/${DEFAULT_BRANCH}" | awk '{print $1}')"
          if [[ "${current_head}" != "${EXPECTED_HEAD}" ]]; then
            echo "PR head changed from verified H ${EXPECTED_HEAD} to ${current_head}" >&2
            exit 1
          fi
          git fetch --no-tags origin "${current_base}" "${EXPECTED_HEAD}"
          if ! git merge-base --is-ancestor "${current_base}" "${EXPECTED_HEAD}"; then
            echo "PR became stale: current main ${current_base} is not an ancestor of H ${EXPECTED_HEAD}" >&2
            exit 1
          fi

      - name: Reconfirm current-head checks and review policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ needs.verify.outputs.head }}
        run: *require_acceptance

      - name: Mint auto-forward token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTO_FORWARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_FORWARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Fast-forward main
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ needs.verify.outputs.head }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --no-tags origin "${DEFAULT_BRANCH}" "${HEAD_SHA}"
          git push origin "${HEAD_SHA}:refs/heads/${DEFAULT_BRANCH}"
          actual="$(git ls-remote origin "refs/heads/${DEFAULT_BRANCH}" | awk '{print $1}')"
          if [[ "${actual}" != "${HEAD_SHA}" ]]; then
            echo "main readback ${actual} does not equal verified H ${HEAD_SHA}" >&2
            exit 1
          fi
          {
            echo '## Auto-forward result'
            echo
            echo "- PR: #${{ inputs.pr_number }}"
            echo "- Verified/integrated H: ${HEAD_SHA}"
            echo "- New ${DEFAULT_BRANCH}: ${actual}"
            echo "- Integration: non-force fast-forward"
            echo "- New commit created during integration: no"
          } >> "${GITHUB_STEP_SUMMARY}"

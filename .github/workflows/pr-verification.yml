name: PR verification

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PR verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" -o "${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" actionlint
          ./actionlint

      - name: Public Go minimum
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: false

      - name: Minimum Go - llmkit
        working-directory: llmkit
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: go test ./...

      - name: Minimum Go - codexsdk
        working-directory: codexsdk
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: go test ./...

      - name: Minimum Go - Codex adapter current source
        working-directory: llmcaller/codex
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          cp go.mod .verify.mod
          cp go.sum .verify.sum
          trap 'rm -f .verify.mod .verify.sum' EXIT
          go mod edit -modfile=.verify.mod \
            -replace=github.com/ronhuafeng/llm-go/llmkit=../../llmkit \
            -replace=github.com/ronhuafeng/llm-go/codexsdk=../../codexsdk
          verify_mod="$(pwd)/.verify.mod"
          GOFLAGS="-modfile=${verify_mod}" go test ./...

      - name: Repository Go minimum
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Minimum Go - repository-local tools
        working-directory: internal/tools
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: go test ./internal/...

      - name: Minimum Go - current-source composition
        working-directory: internal/tools
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          cp go.mod .verify.mod
          cp go.sum .verify.sum
          trap 'rm -f .verify.mod .verify.sum' EXIT
          go mod edit -modfile=.verify.mod \
            -replace=github.com/ronhuafeng/llm-go/llmkit=../../llmkit \
            -replace=github.com/ronhuafeng/llm-go/codexsdk=../../codexsdk \
            -replace=github.com/ronhuafeng/llm-go/llmcaller/codex=../../llmcaller/codex
          verify_mod="$(pwd)/.verify.mod"
          export GOFLAGS="-modfile=${verify_mod}"
          go mod tidy
          go test ./integration

      - name: Current Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: |
            llmkit/go.sum
            codexsdk/go.sum
            llmcaller/codex/go.sum
            internal/tools/go.sum

      - name: Go formatting and whitespace
        run: |
          set -euo pipefail
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          if [[ -n "${unformatted}" ]]; then
            echo "gofmt required:" >&2
            printf '%s\n' "${unformatted}" >&2
            exit 1
          fi
          git diff --check

      - name: Verify llmkit
        working-directory: llmkit
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race ./...

      - name: Verify codexsdk
        working-directory: codexsdk
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race ./...

      - name: Verify Codex adapter current source
        working-directory: llmcaller/codex
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          cp go.mod .verify.mod
          cp go.sum .verify.sum
          trap 'rm -f .verify.mod .verify.sum' EXIT
          go mod edit -modfile=.verify.mod \
            -replace=github.com/ronhuafeng/llm-go/llmkit=../../llmkit \
            -replace=github.com/ronhuafeng/llm-go/codexsdk=../../codexsdk
          verify_mod="$(pwd)/.verify.mod"
          export GOFLAGS="-modfile=${verify_mod}"
          go mod tidy
          go vet ./...
          go test -race ./...

      - name: Verify repository-local tools
        working-directory: internal/tools
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          go mod tidy -diff
          go vet ./internal/...
          go test -race ./internal/...

      - name: Current-source composition
        working-directory: internal/tools
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          cp go.mod .verify.mod
          cp go.sum .verify.sum
          trap 'rm -f .verify.mod .verify.sum' EXIT
          go mod edit -modfile=.verify.mod \
            -replace=github.com/ronhuafeng/llm-go/llmkit=../../llmkit \
            -replace=github.com/ronhuafeng/llm-go/codexsdk=../../codexsdk \
            -replace=github.com/ronhuafeng/llm-go/llmcaller/codex=../../llmcaller/codex
          verify_mod="$(pwd)/.verify.mod"
          export GOFLAGS="-modfile=${verify_mod}"
          go mod tidy
          go test -race ./integration

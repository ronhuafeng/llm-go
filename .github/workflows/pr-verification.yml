name: PR verification

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Root source verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt and whitespace
        run: |
          set -euo pipefail
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          if [[ -n "${unformatted}" ]]; then
            echo "gofmt required:" >&2
            printf '%s\n' "${unformatted}" >&2
            exit 1
          fi
          git diff --check
      - name: Workflow syntax
        env:
          GOTOOLCHAIN: local
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Root module proof
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          go mod tidy -diff
          go vet ./...
          go test -race ./...
      - name: Worktree remains clean
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          git diff --check
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short >&2
            echo "verification left a dirty worktree" >&2
            exit 1
          fi

  generated-reproducibility:
    name: Codex generated reproducibility
    uses: ./.github/workflows/verify-generated.yml

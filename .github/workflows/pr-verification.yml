name: PR verification

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PR verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Minimum Go compatibility
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: false
      - name: Test public modules on minimum Go
        run: |
          for module in llmkit codexsdk llmcaller/codex; do
            (cd "$module" && GOWORK=off GOTOOLCHAIN=local go test ./...)
          done
      - name: Current Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: |
            llmkit/go.sum
            codexsdk/go.sum
            llmcaller/codex/go.sum
            internal/tools/go.sum
      - name: Deterministic proofs and executable examples
        run: ./scripts/verify.sh

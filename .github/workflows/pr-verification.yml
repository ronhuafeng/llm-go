name: PR verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-protocol:
    name: Codex protocol provenance
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify protocol provenance requirement
        id: classify
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 "https://github.com/${BASE_REPOSITORY}.git" "${BASE_SHA}"
          if git diff --quiet "${BASE_SHA}" "${HEAD_SHA}" -- \
            codexsdk \
            go.mod \
            go.sum \
            .github/workflows/pr-verification.yml \
            .github/workflows/verify-generated.yml \
            .github/workflows/codexsdk-upstream-protocol-sync.yml \
            .github/workflows/auto-forward.yml \
            .github/workflows/auto-forward-dispatch.yml
          then
            echo "required=false" >> "${GITHUB_OUTPUT}"
          else
            echo "required=true" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ steps.classify.outputs.required == 'true' }}
        with:
          go-version-file: go.mod
          cache: false

      - name: Provision Codex schema build dependencies
        if: ${{ steps.classify.outputs.required == 'true' }}
        run: |
          set -euo pipefail
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - name: Verify exact upstream provenance
        id: exact
        if: ${{ steps.classify.outputs.required == 'true' }}
        working-directory: codexsdk
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          go run ./internal/cmd/protocolupgrade sync \
            -repo-root "${GITHUB_WORKSPACE}" \
            -module-root . \
            -upstream-repo https://github.com/openai/codex.git \
            -event-name "${GITHUB_EVENT_NAME}" \
            -force-compare \
            -validation-only
          git -C "${GITHUB_WORKSPACE}" diff --exit-code
          if [[ -n "$(git -C "${GITHUB_WORKSPACE}" status --porcelain --untracked-files=normal)" ]]; then
            git -C "${GITHUB_WORKSPACE}" status --short >&2
            echo "exact provenance verification modified the PR head worktree" >&2
            exit 1
          fi

      - name: Summarize protocol provenance
        if: ${{ always() && !cancelled() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUIRED: ${{ steps.classify.outputs.required || 'false' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_REF: ${{ steps.exact.outputs.target_ref }}
          TARGET_SHA: ${{ steps.exact.outputs.target_sha }}
          OUTCOME: ${{ steps.exact.outputs.outcome }}
          REASON: ${{ steps.exact.outputs.reason }}
        run: |
          {
            echo '## Codex protocol provenance'
            echo
            echo "- Event: ${EVENT_NAME}"
            echo "- Verified revision H: ${HEAD_SHA}"
            echo "- Provenance required: ${REQUIRED}"
            echo "- Exact upstream ref U: ${TARGET_REF:-not applicable}"
            echo "- Exact upstream commit U: ${TARGET_SHA:-not applicable}"
            echo "- Outcome: ${OUTCOME:-not applicable}"
            echo "- Reason: ${REASON:-not applicable}"
            echo "- Workflow run/attempt: ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
            echo '- Agent, accepted-worktree Apply, commit, push, and PR publication: not invoked'
          } >> "${GITHUB_STEP_SUMMARY}"

  source:
    name: Root source verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Workflow syntax
        env:
          GOTOOLCHAIN: local
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Install repair oracle sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Enable sandbox namespaces on ephemeral hosted VM
        id: sandbox_host
        env:
          HOSTED_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "${HOSTED_ENVIRONMENT}" = github-hosted
          # Ubuntu 24 AppArmor otherwise denies namespace-local loopback setup.
          # This VM-only prerequisite does not change the child sandbox policy.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Prove repair oracle isolation
        id: repair_isolation
        env:
          GOTOOLCHAIN: local
          LLMGO_REPAIR_SANDBOX_TEST: "1"
        run: |
          set -euo pipefail
          package=./codexsdk/internal/protocolsync
          # Keep Go's ten-minute invocation limit and the outer job limit. Each
          # selected top-level test (including all its subtests) runs once.
          listing="$(go test "${package}" -list '^(TestLiveRepairSandbox|TestLiveVerifierProofMatrix)')"
          tests="$(printf '%s\n' "${listing}" | grep -E '^Test[^[:space:]]+$' | sort -u)"
          test -n "${tests}"
          while IFS= read -r name; do
            go test "${package}" -run "^${name}$" -count=1 -timeout=10m -v
          done <<< "${tests}"

      - name: Root module proof
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          go mod tidy -diff
          go vet ./...
          go test -race ./...

      - name: Worktree remains clean
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short >&2
            echo "verification left a dirty worktree" >&2
            exit 1
          fi

  generated-reproducibility:
    name: Codex generated reproducibility
    uses: ./.github/workflows/verify-generated.yml
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  live-codex:
    name: Live Codex integration
    uses: ./.github/workflows/live-codex-smoke.yml
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    secrets:
      CODEX_RESPONSES_API_ENDPOINT: ${{ secrets.CODEX_RESPONSES_API_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

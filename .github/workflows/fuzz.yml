name: Fuzz

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Bounded Go fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Fuzz llmkit contract decode
        env:
          GOTOOLCHAIN: local
        run: go test ./llmkit/llmschema -fuzz=FuzzContractDecode -fuzztime=30s

      - name: Fuzz Codex inbound frames
        env:
          GOTOOLCHAIN: local
        run: go test ./codexsdk -fuzz=FuzzReadInboundJSONRPCFrame -fuzztime=30s

      - name: Fuzz adapter schema policy
        env:
          GOTOOLCHAIN: local
        run: go test ./llmcaller/codex -fuzz=FuzzStrictOutputSchemaFromJSON -fuzztime=30s

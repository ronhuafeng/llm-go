name: Dispatch auto-forward

on:
  workflow_run:
    workflows: ["PR verification"]
    types: [completed]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: auto-forward-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve trusted protocol-sync PR
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "No PR associated with successful verification run; ignoring."
            exit 0
          fi

          pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state' <<<"${pr}")"
          draft="$(jq -r '.draft' <<<"${pr}")"
          base_ref="$(jq -r '.base.ref' <<<"${pr}")"
          head_ref="$(jq -r '.head.ref' <<<"${pr}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr}")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<<"${pr}")"
          author="$(jq -r '.user.login // empty' <<<"${pr}")"
          body="$(jq -r '.body // ""' <<<"${pr}")"

          if [[ "${state}" != open ||
                "${draft}" != false ||
                "${base_ref}" != "${DEFAULT_BRANCH}" ||
                "${head_repo}" != "${REPOSITORY}" ||
                "${author}" != "ronhuafeng-llm-go-sync[bot]" ]]; then
            echo "PR #${PR_NUMBER} is not a trusted protocol-sync PR; ignoring."
            exit 0
          fi

          if [[ "${head_sha}" != "${RUN_HEAD_SHA}" ]]; then
            echo "PR head changed after verification; ignoring."
            exit 0
          fi

          if [[ "${head_ref}" != codex/sync-upstream-* ]]; then
            echo "Unexpected protocol-sync branch: ${head_ref}"
            exit 0
          fi

          if ! grep -Fq '<!-- codexsdk-upstream-sync' <<<"${body}"; then
            echo "Missing protocol-sync marker; ignoring."
            exit 0
          fi

          if ! grep -Fq "sync_commit: ${head_sha}" <<<"${body}"; then
            echo "Protocol-sync marker does not identify current H; ignoring."
            exit 0
          fi

          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch trusted auto-forward
        if: steps.candidate.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh workflow run auto-forward.yml \
            --repo "${REPOSITORY}" \
            --ref "${DEFAULT_BRANCH}" \
            -f "pr_number=${PR_NUMBER}"

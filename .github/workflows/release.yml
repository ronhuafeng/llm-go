name: Release public module

on:
  workflow_dispatch:
    inputs:
      module:
        description: Public module
        required: true
        type: choice
        options: [llmkit, codexsdk, codex-adapter]
      version:
        description: Stable SemVer, for example v0.13.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.module }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, tag, release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production-release
    permissions:
      contents: write
    steps:
      - name: Require dispatch from main
        if: github.ref != 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          echo "release dispatch must originate from refs/heads/main" >&2
          exit 1

      - name: Require release credential
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          test -n "$RELEASE_DEPLOY_KEY" || {
            echo "production-release is missing RELEASE_DEPLOY_KEY" >&2
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          ssh-strict: true
          persist-credentials: true

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: |
            llmkit/go.sum
            codexsdk/go.sum
            llmcaller/codex/go.sum
            internal/tools/go.sum

      - name: Resolve release tag
        id: release
        env:
          MODULE: ${{ inputs.module }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be stable SemVer like v0.13.0" >&2
            exit 1
          fi
          case "$MODULE" in
            llmkit) TAG="llmkit/$VERSION" ;;
            codexsdk) TAG="codexsdk/$VERSION" ;;
            codex-adapter) TAG="llmcaller/codex/$VERSION" ;;
            *) echo "unknown module $MODULE" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Go formatting and whitespace
        run: |
          set -euo pipefail
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          if [[ -n "${unformatted}" ]]; then
            echo "gofmt required:" >&2
            printf '%s\n' "${unformatted}" >&2
            exit 1
          fi
          git diff --check

      - name: Verify llmkit
        working-directory: llmkit
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race ./...

      - name: Verify codexsdk
        working-directory: codexsdk
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race ./...

      - name: Verify Codex adapter
        working-directory: llmcaller/codex
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race ./...

      - name: Verify repository tools
        working-directory: internal/tools
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race ./...

      - name: Current-source composition
        env:
          GOTOOLCHAIN: local
        run: go test -race ./internal/tools/integration

      - name: Create immutable tag at the tested commit
        env:
          COMMIT: ${{ github.sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main^{commit})" = "$COMMIT" || {
            echo "main advanced after this release was dispatched; dispatch again" >&2
            exit 1
          }
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$COMMIT"
          test -z "$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")" || {
            echo "tag $TAG already exists; release versions are append-only" >&2
            exit 1
          }

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" "$COMMIT" -m "$TAG"
          git push --atomic --force-with-lease="refs/tags/$TAG:" origin "refs/tags/$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes "Source commit: $COMMIT. See the module CHANGELOG.md in this tag."

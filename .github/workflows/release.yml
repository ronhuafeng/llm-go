name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, tag, release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production-release
    permissions:
      contents: write
      actions: write
    steps:
      - name: Require dispatch from main
        if: github.ref != 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          echo "release dispatch must originate from refs/heads/main" >&2
          exit 1

      - name: Require release credential
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          test -n "$RELEASE_DEPLOY_KEY" || {
            echo "production-release is missing RELEASE_DEPLOY_KEY" >&2
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          ssh-strict: true
          persist-credentials: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve release tag
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be stable SemVer like v0.1.0" >&2
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Go formatting and whitespace
        run: |
          set -euo pipefail
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          if [[ -n "${unformatted}" ]]; then
            echo "gofmt required:" >&2
            printf '%s\n' "${unformatted}" >&2
            exit 1
          fi
          git diff --check

      - name: Verify root module
        env:
          GOTOOLCHAIN: local
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race ./...

      - name: Prove generated protocol artifacts
        working-directory: codexsdk
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/proof"
          go run ./internal/cmd/generatedproof \
            -expected-repository-commit "${GITHUB_SHA}" \
            -json-out "${RUNNER_TEMP}/proof/generated.json"

      - name: Create immutable tag at the tested commit
        env:
          COMMIT: ${{ github.sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse "refs/remotes/origin/main^{commit}")" = "$COMMIT" || {
            echo "main advanced after this release was dispatched; dispatch again" >&2
            exit 1
          }
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$COMMIT"
          test -z "$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")" || {
            echo "tag $TAG already exists; release versions are append-only" >&2
            exit 1
          }

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" "$COMMIT" -m "$TAG"
          git push --atomic --force-with-lease="refs/tags/$TAG:" origin "refs/tags/$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes "Source commit: $COMMIT. See CHANGELOG.md in this tag."

      - name: Dispatch post-release observation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh workflow run post-release-module-smoke.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "tag=${TAG}"

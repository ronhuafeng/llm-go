name: Release public module

on:
  workflow_dispatch:
    inputs:
      module:
        description: Public module
        required: true
        type: choice
        options: [llmkit, codexsdk, codex-adapter]
      version:
        description: Stable SemVer, for example v0.13.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.module }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, tag, release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production-release
    permissions:
      contents: write
      actions: write
    steps:
      - name: Require dispatch from main
        if: github.ref != 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          echo "release dispatch must originate from refs/heads/main" >&2
          exit 1

      - name: Require release credential
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          test -n "$RELEASE_DEPLOY_KEY" || {
            echo "production-release is missing RELEASE_DEPLOY_KEY" >&2
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          ssh-strict: true
          persist-credentials: true

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache-dependency-path: |
            llmkit/go.sum
            codexsdk/go.sum
            llmcaller/codex/go.sum
            internal/tools/go.sum

      - name: Resolve release tag
        id: release
        env:
          MODULE: ${{ inputs.module }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be stable SemVer like v0.13.0" >&2
            exit 1
          fi
          case "$MODULE" in
            llmkit) TAG="llmkit/$VERSION" ;;
            codexsdk) TAG="codexsdk/$VERSION" ;;
            codex-adapter) TAG="llmcaller/codex/$VERSION" ;;
            *) echo "unknown module $MODULE" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Go formatting and whitespace
        run: |
          set -euo pipefail
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          if [[ -n "${unformatted}" ]]; then
            echo "gofmt required:" >&2
            printf '%s\n' "${unformatted}" >&2
            exit 1
          fi
          git diff --check

      - name: Verify llmkit
        working-directory: llmkit
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race ./...

      - name: Verify codexsdk
        working-directory: codexsdk
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race ./...

      - name: Verify Codex adapter current source
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          GOWORK=off go run -C internal/moduleproof ./cmd/verifymodfile \
            -go-mod "$(pwd)/llmcaller/codex/go.mod" \
            -go-sum "$(pwd)/llmcaller/codex/go.sum" \
            -replace github.com/ronhuafeng/llm-go/llmkit=../../llmkit \
            -replace github.com/ronhuafeng/llm-go/codexsdk=../../codexsdk \
            -out-mod "${RUNNER_TEMP}/codex.verify.mod" \
            -out-sum "${RUNNER_TEMP}/codex.verify.sum"
          export GOFLAGS="-modfile=${RUNNER_TEMP}/codex.verify.mod"
          (
            cd llmcaller/codex
            go vet ./...
            go test -race ./...
          )

      - name: Verify Codex adapter published dependency closure
        if: inputs.module == 'codex-adapter'
        working-directory: llmcaller/codex
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race ./...

      - name: Verify repository-local tools
        working-directory: internal/tools
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          go mod tidy -diff
          go vet ./internal/...
          go test -race ./internal/...

      - name: Verify moduleproof
        working-directory: internal/moduleproof
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race ./...

      - name: Prove generated protocol artifacts
        working-directory: codexsdk
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/proof"
          go run ./internal/cmd/generatedproof \
            -repository-commit "${GITHUB_SHA}" \
            -json-out "${RUNNER_TEMP}/proof/generated.json"

      - name: Current-source composition
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          GOWORK=off go run -C internal/moduleproof ./cmd/verifymodfile \
            -go-mod "$(pwd)/internal/tools/go.mod" \
            -go-sum "$(pwd)/internal/tools/go.sum" \
            -replace github.com/ronhuafeng/llm-go/llmkit=../../llmkit \
            -replace github.com/ronhuafeng/llm-go/codexsdk=../../codexsdk \
            -replace github.com/ronhuafeng/llm-go/llmcaller/codex=../../llmcaller/codex \
            -out-mod "${RUNNER_TEMP}/tools.verify.mod" \
            -out-sum "${RUNNER_TEMP}/tools.verify.sum"
          export GOFLAGS="-modfile=${RUNNER_TEMP}/tools.verify.mod"
          (
            cd internal/tools
            go mod tidy
            go test -race ./integration
          )

      - name: Create immutable tag at the tested commit
        env:
          COMMIT: ${{ github.sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse "refs/remotes/origin/main^{commit}")" = "$COMMIT" || {
            echo "main advanced after this release was dispatched; dispatch again" >&2
            exit 1
          }
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$COMMIT"
          test -z "$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")" || {
            echo "tag $TAG already exists; release versions are append-only" >&2
            exit 1
          }

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" "$COMMIT" -m "$TAG"
          git push --atomic --force-with-lease="refs/tags/$TAG:" origin "refs/tags/$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes "Source commit: $COMMIT. See the module CHANGELOG.md in this tag."

      - name: Dispatch post-release observation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh workflow run post-release-module-smoke.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "tag=${TAG}"

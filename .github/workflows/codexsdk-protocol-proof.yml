name: Codex protocol proof

on:
  workflow_call:
    inputs:
      repository-sha:
        required: true
        type: string
      target-ref:
        required: true
        type: string
      target-sha:
        required: true
        type: string
      target-kind:
        required: true
        type: string
      restore-worktree:
        required: false
        type: boolean
        default: false
      restore-candidate:
        required: false
        type: boolean
        default: false
      run-attempt:
        required: true
        type: string

permissions:
  contents: read

jobs:
  generated:
    name: Generated reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.repository-sha }}
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: codexsdk/go.mod
          cache: false

      - name: Restore applied worktree
        if: inputs.restore-worktree
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: protocol-worktree-attempt-${{ inputs.run-attempt }}
          path: ${{ runner.temp }}/protocol-worktree

      - name: Apply worktree patch
        if: inputs.restore-worktree
        run: git apply --binary "${RUNNER_TEMP}/protocol-worktree/protocol-worktree.patch"

      - name: Prove generated artifacts
        working-directory: codexsdk
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
          TARGET_SHA: ${{ inputs.target-sha }}
          TARGET_REF: ${{ inputs.target-ref }}
          TARGET_KIND: ${{ inputs.target-kind }}
          REPOSITORY_COMMIT: ${{ inputs.repository-sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/proof"
          if [[ -z "${TARGET_SHA}" || -z "${TARGET_REF}" || -z "${TARGET_KIND}" || -z "${REPOSITORY_COMMIT}" ]]; then
            echo "generated proof requires exact repository commit and upstream ref/kind/sha" >&2
            exit 1
          fi
          go run ./internal/cmd/generatedproof \
            -expected-upstream-commit "${TARGET_SHA}" \
            -expected-upstream-ref "${TARGET_REF}" \
            -expected-upstream-kind "${TARGET_KIND}" \
            -expected-repository-commit "${REPOSITORY_COMMIT}" \
            -json-out "${RUNNER_TEMP}/proof/generated.json"

      - name: Upload generated proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-proof-attempt-${{ inputs.run-attempt }}
          path: ${{ runner.temp }}/proof/generated.json
          if-no-files-found: error

  owner-local:
    name: Owner-local tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.repository-sha }}
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: codexsdk/go.mod
          cache: false

      - name: Restore applied worktree
        if: inputs.restore-worktree
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: protocol-worktree-attempt-${{ inputs.run-attempt }}
          path: ${{ runner.temp }}/protocol-worktree

      - name: Apply worktree patch
        if: inputs.restore-worktree
        run: git apply --binary "${RUNNER_TEMP}/protocol-worktree/protocol-worktree.patch"

      - name: Owner-local codexsdk tests
        working-directory: codexsdk
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: go test ./...

  schema-state:
    name: Candidate schema state
    if: ${{ inputs.restore-candidate }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.repository-sha }}
          persist-credentials: false

      - name: Restore applied worktree
        if: inputs.restore-worktree
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: protocol-worktree-attempt-${{ inputs.run-attempt }}
          path: ${{ runner.temp }}/protocol-worktree

      - name: Apply worktree patch
        if: inputs.restore-worktree
        run: git apply --binary "${RUNNER_TEMP}/protocol-worktree/protocol-worktree.patch"

      - name: Restore candidate schema
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: protocol-candidate-attempt-${{ inputs.run-attempt }}
          path: ${{ runner.temp }}/protocol-candidate

      - name: Candidate schema state
        working-directory: codexsdk
        env:
          TARGET_SHA: ${{ inputs.target-sha }}
        run: |
          set -euo pipefail
          candidate="${RUNNER_TEMP}/protocol-candidate"
          if [[ ! -d "${candidate}" ]]; then
            echo "candidate schema artifact is missing" >&2
            exit 1
          fi
          python3 scripts/codexsdk_sync_state.py \
            --baseline internal/protocolschema/appserver/v2 \
            --candidate "${candidate}" \
            --target-sha "${TARGET_SHA}"

  script-tests:
    name: Remaining script tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.repository-sha }}
          persist-credentials: false

      - name: Restore applied worktree
        if: inputs.restore-worktree
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: protocol-worktree-attempt-${{ inputs.run-attempt }}
          path: ${{ runner.temp }}/protocol-worktree

      - name: Apply worktree patch
        if: inputs.restore-worktree
        run: git apply --binary "${RUNNER_TEMP}/protocol-worktree/protocol-worktree.patch"

      - name: Remaining script tests
        working-directory: codexsdk
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p '*_test.py'

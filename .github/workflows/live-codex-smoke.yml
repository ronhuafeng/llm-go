name: Live Codex integration

on:
  workflow_call:
    inputs:
      repository:
        type: string
        required: false
      ref:
        type: string
        required: false
      base_sha:
        type: string
        required: false
    secrets:
      CODEX_RESPONSES_API_ENDPOINT:
        required: false
      AZURE_OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Compare this base to the dispatched revision; empty runs the live suite."
        type: string
        required: false

permissions:
  contents: read

jobs:
  integration:
    name: Live scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Classify live requirement
        id: classify
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]]; then
            git fetch --no-tags origin "${BASE_SHA}"
            head="$(git rev-parse HEAD)"
            required="$(go run ./internal/tools/cmd/livecodex classify -base "${BASE_SHA}" -head "${head}")"
          else
            required=true
          fi
          echo "required=${required}" >> "${GITHUB_OUTPUT}"
          if [[ "${required}" == false ]]; then
            echo 'Live Codex integration: not applicable (no runtime-affecting changes).' >> "${GITHUB_STEP_SUMMARY}"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.classify.outputs.required == 'true'
        with:
          node-version: "24"
      - name: Select exact official runtime
        id: runtime
        if: steps.classify.outputs.required == 'true'
        run: |
          set -euo pipefail
          version="$(go run ./internal/tools/cmd/livecodex version)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Install selected official Codex
        if: steps.classify.outputs.required == 'true'
        env:
          CODEX_RELEASE: ${{ steps.runtime.outputs.version }}
        run: |
          set -euo pipefail
          npm install --global "@openai/codex@${CODEX_RELEASE}"
          codex --version
      - name: Run real Codex suite once
        if: steps.classify.outputs.required == 'true'
        env:
          MINI_CODEX_BASE_URL: ${{ secrets.CODEX_RESPONSES_API_ENDPOINT }}
          MINI_CODEX_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # Existing endpoint secrets may include /responses; canonical input is a base URL.
          base_url="${MINI_CODEX_BASE_URL%/}"
          export MINI_CODEX_BASE_URL="${base_url%/responses}"
          go run ./internal/tools/cmd/livecodex run
      - name: Worktree remains clean
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo 'Live verification modified the tested worktree.' >&2
            exit 1
          fi

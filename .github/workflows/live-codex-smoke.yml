name: Live Codex integration

on:
  workflow_call:
    inputs:
      repository:
        type: string
        required: false
      ref:
        type: string
        required: false
      base_sha:
        type: string
        required: false
    secrets:
      CODEX_RESPONSES_API_ENDPOINT:
        required: false
      AZURE_OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Compare this base to the dispatched revision; empty runs the live suite."
        type: string
        required: false

permissions:
  contents: read

jobs:
  integration:
    name: Live scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Classify live requirement
        id: classify
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]]; then
            git fetch --no-tags origin "${BASE_SHA}"
            head="$(git rev-parse HEAD)"
            required="$(go run ./internal/tools/cmd/livecodex classify -base "${BASE_SHA}" -head "${head}")"
          else
            required=true
          fi
          echo "required=${required}" >> "${GITHUB_OUTPUT}"
          if [[ "${required}" == false ]]; then
            echo 'Live Codex integration: not applicable (no runtime-affecting changes).' >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Set up official Codex latest
        id: runtime
        if: steps.classify.outputs.required == 'true'
        uses: ./.github/actions/setup-codex
      - name: Enable sandbox namespaces on ephemeral hosted VM
        id: sandbox_host
        if: steps.classify.outputs.required == 'true'
        env:
          HOSTED_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "${HOSTED_ENVIRONMENT}" = github-hosted
          # Ubuntu 24 AppArmor otherwise denies namespace-local loopback setup.
          # This VM-only prerequisite does not change the child sandbox policy.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Verify live through shared gate
        id: goal_gate
        if: steps.classify.outputs.required == 'true'
        env:
          GOTOOLCHAIN: local
          CODEX_CLI_VERSION: ${{ steps.runtime.outputs.version }}
          CODEX_RESPONSES_API_ENDPOINT: ${{ secrets.CODEX_RESPONSES_API_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          set +e
          path="$(python3 .github/scripts/verify-protocol-gate.py live)"
          status=$?
          echo "path=${path}" >> "${GITHUB_OUTPUT}"
          echo "head=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          exit "${status}"

      - name: Retain complete live diagnostics
        if: ${{ always() && !cancelled() && steps.goal_gate.outputs.path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-goal-live-${{ steps.goal_gate.outputs.head }}-${{ github.run_attempt }}
          path: ${{ steps.goal_gate.outputs.path }}
          if-no-files-found: error
      - name: Worktree remains clean
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo 'Live verification modified the tested worktree.' >&2
            exit 1
          fi

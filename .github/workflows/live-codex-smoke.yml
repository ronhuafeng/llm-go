name: Live Codex smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - PR verification
    types:
      - completed

concurrency:
  group: live-codex-smoke-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Real app-server composition
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.actor.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LLMGO_LIVE_CODEX_MODEL: gpt-5.6-luna
      LLMGO_LIVE_CODEX_REASONING_EFFORT: medium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Install Codex CLI and Responses proxy
        run: |
          npm install --global \
            @openai/codex@latest \
            @openai/codex-responses-api-proxy@0.153.4
          codex --version
      - name: Start Codex Responses API proxy
        id: proxy
        env:
          PROXY_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          SERVER_INFO_FILE: ${{ runner.temp }}/live-codex-responses-proxy.json
          UPSTREAM_URL: ${{ secrets.CODEX_RESPONSES_API_ENDPOINT }}
        run: |
          set -euo pipefail
          : "${PROXY_API_KEY:?AZURE_OPENAI_API_KEY is required}"
          : "${UPSTREAM_URL:?CODEX_RESPONSES_API_ENDPOINT is required}"

          (
            printenv PROXY_API_KEY |
              env -u PROXY_API_KEY -u UPSTREAM_URL \
                codex-responses-api-proxy \
                --server-info "${SERVER_INFO_FILE}" \
                --upstream-url "${UPSTREAM_URL}"
          ) &
          proxy_pid=$!

          for _ in {1..100}; do
            if jq -e '.port | numbers' "${SERVER_INFO_FILE}" >/dev/null 2>&1; then
              break
            fi
            sleep 0.1
          done
          proxy_port="$(jq -er '.port | numbers' "${SERVER_INFO_FILE}")"
          {
            echo "pid=${proxy_pid}"
            echo "port=${proxy_port}"
          } >> "${GITHUB_OUTPUT}"
      - name: Configure isolated app-server provider
        env:
          CODEX_HOME: ${{ runner.temp }}/llm-go-live-codex-home
          PROXY_PORT: ${{ steps.proxy.outputs.port }}
        run: |
          set -euo pipefail
          mkdir -p "${CODEX_HOME}"
          cat > "${CODEX_HOME}/config.toml" <<EOF
          model = "${LLMGO_LIVE_CODEX_MODEL}"
          model_provider = "llm-go-smoke"
          model_reasoning_effort = "${LLMGO_LIVE_CODEX_REASONING_EFFORT}"

          [model_providers.llm-go-smoke]
          name = "llm-go smoke proxy"
          base_url = "http://127.0.0.1:${PROXY_PORT}/v1"
          wire_api = "responses"
          request_max_retries = 0
          stream_max_retries = 0
          supports_websockets = false
          requires_openai_auth = false
          EOF
      - name: Run real Codex smoke
        env:
          CODEX_HOME: ${{ runner.temp }}/llm-go-live-codex-home
          LLMGO_LIVE_CODEX: "1"
        run: |
          set -euo pipefail
          env -u AZURE_OPENAI_API_KEY -u CODEX_RESPONSES_API_ENDPOINT \
            go test ./internal/tools/integration \
              -run '^TestLiveCodexSmoke$' \
              -count=1 \
              -v
      - name: Stop Codex Responses API proxy
        if: ${{ always() }}
        env:
          PROXY_PID: ${{ steps.proxy.outputs.pid }}
        run: |
          if [[ -n "${PROXY_PID}" ]] && kill -0 "${PROXY_PID}" 2>/dev/null; then
            kill "${PROXY_PID}"
          fi
